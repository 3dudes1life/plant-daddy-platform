<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#153923" />
  <meta name="color-scheme" content="light dark" />
  <title>Plant Daddy — Consumer Alpha 1.1</title>
  <style>
    :root {
      --bg: #f3f5f0;
      --bg-elevated: rgba(255,255,255,.86);
      --card: #ffffff;
      --card-2: #f8faf6;
      --text: #142018;
      --sub: #687169;
      --muted: #929a93;
      --line: #e1e6df;
      --accent: #277a49;
      --accent-strong: #155b32;
      --accent-soft: #e4f3e8;
      --accent-softer: #eef7f0;
      --warning: #a86612;
      --warning-soft: #fff3df;
      --danger: #b23b38;
      --danger-soft: #fde9e8;
      --shadow: 0 18px 55px rgba(32, 64, 42, .10);
      --shadow-soft: 0 8px 26px rgba(32, 64, 42, .07);
      --glass: rgba(247,249,245,.80);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d130f;
        --bg-elevated: rgba(23,31,25,.88);
        --card: #172019;
        --card-2: #1c271f;
        --text: #f2f6f2;
        --sub: #a4afa6;
        --muted: #78827a;
        --line: #2b362e;
        --accent: #7ad59b;
        --accent-strong: #9ce7b5;
        --accent-soft: #203d2a;
        --accent-softer: #172d20;
        --warning: #f0b965;
        --warning-soft: #382b19;
        --danger: #ff8f89;
        --danger-soft: #3a2020;
        --shadow: none;
        --shadow-soft: none;
        --glass: rgba(17,24,19,.82);
      }
    }
    html[data-theme="light"] {
      --bg: #f3f5f0; --bg-elevated: rgba(255,255,255,.86); --card: #ffffff; --card-2: #f8faf6;
      --text: #142018; --sub: #687169; --muted: #929a93; --line: #e1e6df; --accent: #277a49;
      --accent-strong: #155b32; --accent-soft: #e4f3e8; --accent-softer: #eef7f0; --warning: #a86612;
      --warning-soft: #fff3df; --danger: #b23b38; --danger-soft: #fde9e8; --shadow: 0 18px 55px rgba(32,64,42,.10);
      --shadow-soft: 0 8px 26px rgba(32,64,42,.07); --glass: rgba(247,249,245,.80); color-scheme: light;
    }
    html[data-theme="dark"] {
      --bg: #0d130f; --bg-elevated: rgba(23,31,25,.88); --card: #172019; --card-2: #1c271f;
      --text: #f2f6f2; --sub: #a4afa6; --muted: #78827a; --line: #2b362e; --accent: #7ad59b;
      --accent-strong: #9ce7b5; --accent-soft: #203d2a; --accent-softer: #172d20; --warning: #f0b965;
      --warning-soft: #382b19; --danger: #ff8f89; --danger-soft: #3a2020; --shadow: none; --shadow-soft: none;
      --glass: rgba(17,24,19,.82); color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { color: inherit; }
    input, select, textarea { color: var(--text); }
    .app { min-height: 100vh; }
    .page-shell { min-height: 100vh; padding-bottom: 102px; }
    .page { width: min(760px, 100%); margin: 0 auto; padding: 24px 20px 38px; }
    .onboarding-page { width: min(660px,100%); margin: 0 auto; min-height: 100vh; padding: max(24px, env(safe-area-inset-top)) 20px max(34px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
    .brandbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
    .brand { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:900; letter-spacing:-.2px; }
    .brand-mark { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--accent-soft); font-size:20px; }
    .build-tag { border-radius:999px; background:var(--card); border:1px solid var(--line); padding:7px 10px; color:var(--sub); font-size:11px; font-weight:800; letter-spacing:.3px; }
    .progress { display:flex; gap:7px; margin: 0 0 24px; }
    .progress span { height:5px; flex:1; border-radius:99px; background:var(--line); transition:.2s ease; }
    .progress span.on { background:var(--accent); }
    .onboarding-card { margin:auto 0; background:var(--bg-elevated); border:1px solid var(--line); border-radius:30px; padding:clamp(24px,6vw,38px); box-shadow:var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .hero-icon { width:78px; height:78px; border-radius:25px; display:grid; place-items:center; font-size:43px; background:linear-gradient(145deg,var(--accent-soft),var(--card)); box-shadow:var(--shadow-soft); margin-bottom:23px; }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:900; letter-spacing:1.45px; text-transform:uppercase; }
    h1 { font-size:clamp(34px,8vw,52px); line-height:1.02; margin:9px 0 0; font-weight:950; letter-spacing:-1.8px; }
    h2 { font-size:clamp(27px,6vw,36px); line-height:1.07; margin:8px 0 0; font-weight:920; letter-spacing:-1.1px; }
    .lead { margin:14px 0 0; color:var(--sub); font-size:17px; line-height:1.52; }
    .tagline { display:inline-flex; align-items:center; gap:8px; margin-top:19px; padding:9px 12px; border-radius:999px; background:var(--accent-soft); color:var(--accent-strong); font-size:13px; font-weight:850; }
    .actions { display:grid; gap:10px; margin-top:18px; }
    .actions.inline { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .button { border:0; border-radius:17px; padding:15px 17px; min-height:52px; font-weight:880; cursor:pointer; transition:transform .14s ease, opacity .14s ease; }
    .button:active { transform:scale(.985); }
    .button.primary { background:var(--accent-strong); color:#fff; }
    @media (prefers-color-scheme: dark) { .button.primary { color:#0b1a10; } }
    .button.secondary { background:var(--card); border:1px solid var(--line); }
    .button.soft { background:var(--accent-soft); color:var(--accent-strong); }
    .button.ghost { background:transparent; color:var(--accent); }
    .button.small { min-height:42px; padding:10px 12px; border-radius:14px; font-size:13px; }
    .button:disabled { cursor:not-allowed; opacity:.45; }
    .fineprint { margin-top:14px; color:var(--muted); font-size:12px; line-height:1.45; text-align:center; }
    .parent-grid { display:grid; gap:11px; margin-top:24px; }
    .parent-choice { width:100%; border:1.5px solid var(--line); background:var(--card); border-radius:21px; padding:15px 16px; display:flex; align-items:center; gap:14px; cursor:pointer; text-align:left; transition:.17s ease; }
    .parent-choice.active { background:var(--accent-softer); border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
    .parent-avatar { width:50px; height:50px; border-radius:16px; display:grid; place-items:center; font-size:27px; background:var(--card-2); }
    .parent-copy { flex:1; min-width:0; }
    .parent-name { font-size:17px; font-weight:900; display:block; }
    .parent-pronouns { margin-top:3px; color:var(--sub); font-size:13px; display:block; }
    .parent-line { margin-top:5px; color:var(--sub); font-size:12px; display:block; }
    .selection-check { width:25px; height:25px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-size:14px; font-weight:900; color:transparent; }
    .parent-choice.active .selection-check, .mode-card.active .selection-check { background:var(--accent); border-color:var(--accent); color:white; }
    .field-stack, .edit-form { display:grid; gap:17px; margin-top:18px; }
    .field label { display:block; font-size:12px; font-weight:850; color:var(--sub); margin:0 0 7px 4px; }
    .field input, .field select, .field textarea { width:100%; border:1.5px solid var(--line); background:var(--card); border-radius:17px; min-height:54px; padding:12px 16px; outline:none; font-size:16px; transition:.16s border-color,.16s box-shadow; }
    .field textarea { min-height:110px; resize:vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
    .field-help { color:var(--muted); font-size:12px; line-height:1.45; margin:7px 4px 0; }
    .setup-preview { margin-top:18px; border-radius:20px; padding:16px; background:var(--card-2); border:1px solid var(--line); }
    .crumb { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:850; }
    .crumb span { color:var(--muted); }
    .topbar { position:sticky; top:0; z-index:30; background:var(--glass); border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
    .topbar-inner { width:min(760px,100%); margin:auto; padding:max(10px,env(safe-area-inset-top)) 20px 10px; display:flex; align-items:center; gap:12px; }
    .topbar .brand { flex:1; }
    .local-pill { display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent-strong); font-size:11px; font-weight:850; }
    .page-title { margin:6px 0 0; font-size:clamp(31px,7vw,43px); line-height:1.05; }
    .page-sub { color:var(--sub); font-size:15px; line-height:1.5; margin:9px 0 23px; }
    .summary-row { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:0 0 25px; }
    .summary { border-radius:19px; background:var(--card); padding:14px; box-shadow:var(--shadow-soft); border:1px solid color-mix(in srgb,var(--line) 80%,transparent); }
    .summary b { display:block; font-size:25px; }
    .summary span { display:block; margin-top:2px; color:var(--sub); font-size:11px; font-weight:800; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin:20px 0 11px; }
    .section-title { font-size:19px; font-weight:900; }
    .text-button { border:0; background:transparent; color:var(--accent); font-weight:850; cursor:pointer; padding:5px 0; }
    .card { background:var(--card); border:1px solid color-mix(in srgb,var(--line) 80%,transparent); border-radius:22px; padding:18px; margin-bottom:11px; box-shadow:var(--shadow-soft); }
    .card-title { font-size:17px; font-weight:900; }
    .card-copy { color:var(--sub); font-size:14px; line-height:1.48; margin-top:5px; }
    .row { display:flex; align-items:center; gap:13px; }
    .row-icon { width:44px; height:44px; flex:none; border-radius:14px; background:var(--card-2); display:grid; place-items:center; font-size:23px; }
    .grow { flex:1; min-width:0; }
    .muted { color:var(--sub); }
    .chev { margin-left:auto; color:var(--muted); font-size:24px; }
    .empty { text-align:center; padding:30px 21px 25px; }
    .empty-icon { width:74px; height:74px; margin:0 auto 17px; display:grid; place-items:center; background:var(--accent-soft); border-radius:24px; font-size:39px; }
    .empty h3 { font-size:21px; margin:0; }
    .empty p { color:var(--sub); font-size:14px; line-height:1.5; margin:8px 0 0; }
    .privacy-card { background:var(--accent-softer); }
    .privacy-title { display:flex; gap:8px; align-items:center; font-weight:900; }
    .privacy-copy { color:var(--sub); font-size:13px; line-height:1.5; margin-top:7px; }
    .nav { position:fixed; left:0; right:0; bottom:0; z-index:40; display:grid; grid-template-columns:repeat(5,1fr); background:var(--glass); border-top:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); padding:8px max(8px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left)); }
    .nav button { border:0; background:transparent; color:var(--sub); cursor:pointer; padding:3px 1px; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .nav button.active { color:var(--accent); }
    .nav-icon { font-size:20px; line-height:1.1; }
    .nav-label { font-size:10px; font-weight:820; }
    .modal-wrap { position:fixed; inset:0; z-index:100; display:grid; place-items:end center; background:rgba(0,0,0,.33); padding:18px; opacity:0; pointer-events:none; transition:.18s ease; }
    .modal-wrap.show { opacity:1; pointer-events:auto; }
    .sheet { width:min(560px,100%); max-height:min(88vh,820px); overflow:auto; background:var(--card); border-radius:28px; padding:22px; box-shadow:0 24px 80px rgba(0,0,0,.25); transform:translateY(25px); transition:.2s ease; }
    .modal-wrap.show .sheet { transform:translateY(0); }
    .sheet-handle { width:42px; height:5px; border-radius:99px; background:var(--line); margin:0 auto 18px; }
    .sheet h3 { font-size:22px; margin:10px 0 7px; }
    .sheet p { color:var(--sub); line-height:1.5; margin:0; font-size:14px; }
    .toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(18px); opacity:0; z-index:120; background:var(--text); color:var(--bg); max-width:calc(100vw - 30px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:11px 15px; border-radius:999px; font-size:13px; font-weight:850; pointer-events:none; transition:.2s ease; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    .search-wrap { position:relative; margin:18px 0 12px; }
    .search-wrap input { width:100%; min-height:52px; padding:0 16px 0 44px; border:1.5px solid var(--line); border-radius:17px; background:var(--card); outline:none; font-size:15px; }
    .search-wrap input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
    .search-icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:17px; }
    .chips { display:flex; gap:8px; overflow:auto; padding:1px 1px 7px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { white-space:nowrap; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--sub); padding:8px 11px; font-size:12px; font-weight:830; cursor:pointer; }
    .chip.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }
    .library-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:11px; }
    .library-card { border:1px solid var(--line); background:var(--card); border-radius:20px; padding:15px; text-align:left; cursor:pointer; min-height:143px; transition:.15s ease; }
    .library-card.selected { border-color:var(--accent); background:var(--accent-softer); box-shadow:inset 0 0 0 1px var(--accent); }
    .library-emoji { font-size:32px; }
    .library-name { margin-top:10px; font-size:15px; font-weight:900; }
    .library-scientific { margin-top:3px; color:var(--sub); font-size:11px; font-style:italic; }
    .library-range { margin-top:9px; color:var(--accent); font-size:11px; font-weight:850; }
    .dcw-badge { display:inline-flex; align-items:center; gap:4px; margin-top:8px; padding:4px 7px; border-radius:999px; background:var(--accent-softer); color:var(--accent); font-size:10px; font-weight:900; letter-spacing:.02em; }
    .dcw-note { margin-top:10px; padding:10px 12px; border-radius:14px; background:var(--accent-softer); color:var(--text); font-size:12px; line-height:1.4; }
    .flow-head { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    .flow-back { border:0; background:var(--card); width:40px; height:40px; border-radius:13px; cursor:pointer; font-size:23px; box-shadow:var(--shadow-soft); }
    .mini-progress { display:flex; gap:6px; flex:1; }
    .mini-progress span { height:4px; background:var(--line); border-radius:99px; flex:1; }
    .mini-progress span.on { background:var(--accent); }
    .selected-species { display:flex; align-items:center; gap:14px; background:var(--accent-softer); border:1px solid var(--line); border-radius:21px; padding:16px; margin:15px 0 20px; }
    .selected-species .library-emoji { font-size:38px; }
    .mode-grid { display:grid; gap:11px; margin-top:18px; }
    .mode-card { width:100%; border:1.5px solid var(--line); background:var(--card); border-radius:21px; padding:16px; display:flex; gap:14px; text-align:left; cursor:pointer; }
    .mode-card.active { border-color:var(--accent); background:var(--accent-softer); box-shadow:inset 0 0 0 1px var(--accent); }
    .mode-icon { width:49px; height:49px; border-radius:16px; background:var(--card-2); display:grid; place-items:center; font-size:26px; flex:none; }
    .mode-card .selection-check { margin-left:auto; align-self:center; flex:none; }
    .review-grid { display:grid; gap:9px; margin-top:18px; }
    .review-row { display:flex; gap:12px; justify-content:space-between; background:var(--card-2); border:1px solid var(--line); border-radius:15px; padding:12px 13px; font-size:13px; }
    .review-row span { color:var(--sub); }
    .review-row b { text-align:right; }
    .hardware-note { margin-top:15px; border-radius:17px; background:var(--warning-soft); padding:13px 14px; color:var(--warning); font-size:12px; line-height:1.45; font-weight:720; }
    .plant-actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:16px; }
    .detail-hero { background:linear-gradient(145deg,var(--accent-soft),var(--card)); border:1px solid var(--line); border-radius:26px; padding:22px; margin-bottom:12px; }
    .detail-emoji { font-size:51px; }
    .detail-title { font-size:30px; font-weight:950; letter-spacing:-1px; margin-top:10px; }
    .detail-species { color:var(--sub); margin-top:4px; font-size:13px; font-style:italic; }
    .badge-row { display:flex; flex-wrap:wrap; gap:7px; margin-top:13px; }
    .badge { display:inline-flex; gap:5px; align-items:center; border-radius:999px; padding:7px 10px; background:var(--card); border:1px solid var(--line); font-size:11px; font-weight:800; color:var(--sub); }
    .tab-row { display:flex; gap:8px; overflow:auto; padding:2px 1px 10px; scrollbar-width:none; }
    .tab-row::-webkit-scrollbar { display:none; }
    .tab { white-space:nowrap; border:1px solid var(--line); background:var(--card); color:var(--sub); border-radius:999px; padding:9px 12px; font-size:12px; font-weight:850; cursor:pointer; }
    .tab.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }
    .metrics-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; margin-top:12px; }
    .metric { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; }
    .metric span { display:block; color:var(--sub); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.45px; }
    .metric b { display:block; margin-top:5px; font-size:19px; }
    .care-profile { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:12px; }
    .care-metric { background:var(--card-2); border-radius:16px; padding:13px; border:1px solid var(--line); }
    .care-metric span { display:block; color:var(--sub); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; }
    .care-metric b { display:block; margin-top:4px; font-size:14px; }
    .device-chip { margin-top:12px; border:1px dashed var(--line); border-radius:16px; padding:13px; display:flex; align-items:center; gap:10px; }
    .device-copy b { font-size:13px; }
    .device-copy span { display:block; color:var(--sub); font-size:11px; margin-top:2px; }
    .quick-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:12px; }
    .quick-action { border:1px solid var(--line); background:var(--card); border-radius:18px; padding:14px; text-align:left; cursor:pointer; }
    .quick-action b { display:block; font-size:14px; }
    .quick-action span { display:block; color:var(--sub); font-size:12px; margin-top:4px; line-height:1.35; }
    .timeline { display:grid; gap:10px; margin-top:12px; }
    .timeline-item { position:relative; padding:0 0 0 18px; }
    .timeline-item:before { content:''; position:absolute; left:5px; top:8px; bottom:-12px; width:2px; background:var(--line); }
    .timeline-item:last-child:before { bottom:8px; }
    .timeline-dot { position:absolute; left:0; top:7px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--card); box-shadow:0 0 0 1px var(--accent); }
    .timeline-item.critical .timeline-dot { background:var(--danger); box-shadow:0 0 0 1px var(--danger); }
    .timeline-head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .timeline-head b { font-size:14px; }
    .timeline-head span { color:var(--muted); font-size:12px; }
    .timeline-copy { color:var(--sub); font-size:13px; line-height:1.45; margin-top:4px; }
    .chart-card { padding:16px; }
    .chart-toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .chart-toolbar button { border:1px solid var(--line); background:var(--card-2); color:var(--sub); border-radius:999px; padding:8px 11px; font-size:12px; font-weight:850; cursor:pointer; }
    .chart-toolbar button.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); }
    .chart-wrap { background:var(--card-2); border:1px solid var(--line); border-radius:18px; padding:14px; }

    function ultraInsightFor(p) {
      const readings=logsForPlant(p.id).filter(l=>l.type==='moisture'&&Number.isFinite(Number(l.value))).slice(0,4);
      if(readings.length<2) return `${parent().label} needs a few moisture readings before there is enough history to spot a useful pattern.`;
      const newest=Number(readings[0].value), oldest=Number(readings[readings.length-1].value);
      const hours=Math.max(1,(+new Date(readings[0].date)-+new Date(readings[readings.length-1].date))/36e5);
      const delta=newest-oldest;
      if(delta < -6) return `${p.name} dropped ${Math.abs(delta).toFixed(0)} points over about ${Math.round(hours)} hours. Ultra would learn whether that dry-down is normal for this plant.`;
      if(delta > 6) return `${p.name} gained ${delta.toFixed(0)} moisture points over about ${Math.round(hours)} hours. Ultra would compare that response with prior watering events.`;
      return `${p.name} has stayed fairly steady across the recent readings. Ultra would keep learning its personal baseline.`;

    function effectiveCareProfile(plant) {

    function dryRatePerDay(plantId) {
      const readings=logsForPlant(plantId).filter(l=>l.type==='moisture'&&typeof l.value==='number').slice(0,6).sort((a,b)=>+new Date(a.date)-+new Date(b.date));

    function plantIntelligence(plant) {
      const care=effectiveCareProfile(plant), moisture=lastMoistureReading(plant.id), tempReading=lastSoilTempReading(plant.id);
      const tempValue=tempReading?.value ?? (Number.isFinite(Number(plant.temp))?Number(plant.temp):null);
      const lines=[]; let headline='Building a baseline'; let confidence='Needs data';
      if(!moisture){
        lines.push('Log a moisture reading to compare this plant with its preferred range.');
      } else {
        const age=readingAgeHours(moisture); confidence=age<=24?'Fresh reading':age<=72?'Aging reading':'Stale reading';
        if(care.moistureMin!=null && moisture.value<care.moistureMin){ headline='Below preferred moisture'; lines.push(`Current moisture is ${moisture.value}%, below the ${care.moistureMin}–${care.moistureMax}% target.`); }
        else if(care.moistureMax!=null && moisture.value>care.moistureMax){ headline='Above preferred moisture'; lines.push(`Current moisture is ${moisture.value}%, above the ${care.moistureMin}–${care.moistureMax}% target.`); }
        else if(care.moistureMin!=null){ headline='Inside preferred range'; lines.push(`Current moisture is ${moisture.value}%, inside the ${care.moistureMin}–${care.moistureMax}% target.`); }
        else lines.push(`Current moisture is ${moisture.value}%. Set a custom target to evaluate it.`);

            if(care.moistureMin!=null && moisture.value>care.moistureMin){ const days=(moisture.value-care.moistureMin)/Math.abs(rate); if(days>=0 && days<30) lines.push(`At that simple local rate, it could reach the low target in about ${days<1?Math.max(1,Math.round(days*24))+' hours':days.toFixed(1)+' days'}.`); }
          } else if(rate > 0.5) lines.push(`Recent readings are rising about ${rate.toFixed(1)} points per day, which may reflect watering or wetter conditions.`);
          else lines.push('Recent moisture readings are relatively steady.');
        } else lines.push('Two readings separated by several hours are needed before dry-down rate can be estimated.');
      }

      else if(tempValue!=null) lines.push(`Latest soil temperature context: ${tempValue}°F.`);

    }
    function renderMoistureRange(care, value) {
      if(care.moistureMin==null||care.moistureMax==null) return '';

    function plantMetrics(plant) {

      const range = {min:care.moistureMin, max:care.moistureMax};
      const moisture = lastMoistureReading(plant.id);

        else if (moisture.value <= range.min + 2) { if (status!=='critical') status='attention'; reasons.push(`Moisture is approaching dry range at ${moisture.value}%.`); }

      if (waterDays != null && waterDays >= 10) { status='critical'; reasons.push(`It has been ${waterDays} days since this plant was watered.`); }

        modal.innerHTML = `<div class="sheet" onclick="event.stopPropagation()"><div class="sheet-handle"></div><div class="eyebrow">Care Library v0.6</div><h3>${lib.emoji} ${esc(lib.name)}</h3><p><i>${esc(lib.scientific)}</i></p><span class="profile-source ${source.className}">${esc(source.label)}</span><div class="profile-grid"><div class="profile-item"><span>Moisture</span><b>${care.moistureMin!=null?`${care.moistureMin}–${care.moistureMax}%`:'Not structured'}</b></div><div class="profile-item"><span>Temperature</span><b>${care.tempMinF!=null?`${care.tempMinF}–${care.tempMaxF}°F`:'Not structured'}</b></div><div class="profile-item"><span>Light</span><b>${esc(care.light)}</b></div><div class="profile-item"><span>Soil</span><b>${esc(care.soil)}</b></div><div class="profile-item"><span>Watering</span><b>${esc(care.watering)}</b></div><div class="profile-item"><span>Fertilizer</span><b>${esc(care.fertilizer)}</b></div><div class="profile-item"><span>Environment</span><b>${esc(care.environment)}</b></div><div class="profile-item"><span>Seasonal</span><b>${esc(care.seasonal)}</b></div><div class="profile-item"><span>Toxicity</span><b>${esc(care.toxicity)}</b></div></div>${care.careNotes?`<div class="verification-note"><b>Care notes:</b> ${esc(care.careNotes)}</div>`:''}<div class="verification-note">${esc(source.note)} Toxicity and any missing fields are deliberately marked unverified instead of guessed.</div><div class="actions"><button class="button secondary" onclick="closeModal()">Close</button></div></div>`;
      } else if (kind === 'careProfile') {
        const p=plantById(payload); if(!p)return; const care=effectiveCareProfile(p), o=p.careOverrides||{};
        modal.innerHTML = `<div class="sheet" onclick="event.stopPropagation()"><div class="sheet-handle"></div><div class="eyebrow">Plant-specific care</div><h3>Customize ${esc(p.name)}</h3><p>Overrides belong to this plant only. The shared library profile stays unchanged.</p><div class="field-stack"><div class="row" style="gap:8px"><div class="field grow"><label>MOISTURE MIN %</label><input id="careMoistureMin" type="number" min="0" max="100" value="${esc(o.moistureMin ?? '')}" placeholder="${care.moistureMin ?? ''}"/></div><div class="field grow"><label>MOISTURE MAX %</label><input id="careMoistureMax" type="number" min="0" max="100" value="${esc(o.moistureMax ?? '')}" placeholder="${care.moistureMax ?? ''}"/></div></div><div class="row" style="gap:8px"><div class="field grow"><label>TEMP MIN °F</label><input id="careTempMin" type="number" value="${esc(o.tempMinF ?? '')}" placeholder="${care.tempMinF ?? ''}"/></div><div class="field grow"><label>TEMP MAX °F</label><input id="careTempMax" type="number" value="${esc(o.tempMaxF ?? '')}" placeholder="${care.tempMaxF ?? ''}"/></div></div><div class="field"><label>LIGHT</label><input id="careLight" value="${esc(o.light||'')}" placeholder="${esc(care.light)}"/></div><div class="field"><label>SOIL</label><input id="careSoil" value="${esc(o.soil||'')}" placeholder="${esc(care.soil)}"/></div><div class="field"><label>WATERING GUIDANCE</label><input id="careWatering" value="${esc(o.watering||'')}" placeholder="${esc(care.watering)}"/></div><div class="field"><label>FERTILIZER GUIDANCE</label><input id="careFertilizer" value="${esc(o.fertilizer||'')}" placeholder="${esc(care.fertilizer)}"/></div><div class="field"><label>PLANT-SPECIFIC NOTES</label><textarea id="careNotes" placeholder="Anything special about this exact plant…">${esc(o.careNotes||'')}</textarea></div></div><div class="actions"><button class="button primary" onclick="saveCareOverrides('${p.id}')">Save profile</button><button class="button secondary" onclick="clearCareOverrides('${p.id}')">Use library defaults</button></div></div>`;
      }
      modal.classList.add('show'); modal.setAttribute('aria-hidden','false'); modal.onclick = closeModal;
    }

    function closeModal() { const m=document.getElementById('modal'); m.classList.remove('show'); m.setAttribute('aria-hidden','true'); setTimeout(()=>m.innerHTML='',180); }
    function toDatetimeLocal(iso) { const d = new Date(iso); const pad=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
    function assignStagedDevice(fixedPlantId='') {
      const plantId=fixedPlantId || document.getElementById('devicePlant')?.value;
      const modelId=document.getElementById('deviceModel')?.value;
      const p=plantById(plantId), model=deviceCatalog.find(d=>d.id===modelId);
      if(!p||!model){ toast('Choose a plant and device'); return; }
      const existing=currentDevice(p.id,model.type);
      if(existing){ toast(`${p.name} already has a current ${model.type} device`); return; }
      state.devices.push({id:uid('device'),plantId:p.id,type:model.type,label:model.label,modelId:model.id,status:'staged',simulated:true,current:true,battery:100,signal:'Excellent',assignedAt:nowIso()});
      state.logs.push({id:uid('log'),plantId:p.id,type:'device_added',date:nowIso(),note:`${model.label} assigned as a simulated device.`,value:null});
      if(model.type==='sensor' && p.careMode==='phone') p.careMode='sensor';
      if(model.type==='irrigation') p.careMode='watering';
      saveState(); closeModal(); render(); toast(`${model.label} staged for ${p.name} ✓`);
    }
    function replaceStagedSensor(plantId) {
      const p=plantById(plantId), old=currentDevice(plantId,'sensor');
      const model=deviceCatalog.find(d=>d.id===document.getElementById('replacementModel')?.value);
      if(!p||!old||!model)return;
      const historyCount=logsForPlant(plantId).length, photoCount=photosForPlant(plantId).length;
      old.current=false; old.status='replaced'; old.replacedAt=nowIso();
      state.devices.push({id:uid('device'),plantId:p.id,type:'sensor',label:model.label,modelId:model.id,status:'staged',simulated:true,current:true,battery:100,signal:'Excellent',assignedAt:nowIso()});
      state.logs.push({id:uid('log'),plantId:p.id,type:'device_replaced',date:nowIso(),note:`${old.label} → ${model.label}. Plant identity preserved with ${historyCount} existing history item${historyCount===1?'':'s'} and ${photoCount} photo${photoCount===1?'':'s'}.`,value:null});
      p.careMode='sensor'; saveState(); closeModal(); render(); toast(`Sensor replaced. ${p.name}'s history stayed put 🌱`);
    }
    function enableUltraPreview() { state.ultraPreview=true; saveState(); closeModal(); render(); toast('Ultra preview enabled locally 🧠'); }

    function saveCareOverrides(plantId) {
      const p=plantById(plantId); if(!p)return;
      const get=id=>document.getElementById(id)?.value.trim() || '';
      const min=get('careMoistureMin'), max=get('careMoistureMax'), tmin=get('careTempMin'), tmax=get('careTempMax');
      const validPct=v=>v==='' || (Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)<=100);
      if(!validPct(min)||!validPct(max)){toast('Moisture targets must be 0–100');return;}
      if(min!==''&&max!==''&&Number(min)>=Number(max)){toast('Moisture max needs to be higher than min');return;}
      p.careOverrides={moistureMin:min,moistureMax:max,tempMinF:tmin,tempMaxF:tmax,light:get('careLight'),soil:get('careSoil'),watering:get('careWatering'),fertilizer:get('careFertilizer'),careNotes:get('careNotes')};
      saveState(); closeModal(); render(); toast(`${p.name} care profile saved 🌱`);
    }
    function clearCareOverrides(plantId) { const p=plantById(plantId); if(!p)return; p.careOverrides={}; saveState(); closeModal(); render(); toast('Using shared Care Library defaults'); }
    function setLibraryQuery(value) { state.libraryQuery=value; saveState(); render(); const el=document.getElementById('librarySearch'); if(el){el.focus(); try{el.setSelectionRange(value.length,value.length)}catch{}} }
    function setLibraryCategory(value) { state.libraryCategory=value; saveState(); render(); }
    function libraryResults() {
      const q=(state.libraryQuery||'').trim().toLowerCase();
      return plantLibrary.filter(lib => (state.libraryCategory==='All' || (state.libraryCategory==='DCW Grows'?lib.dcwGuide:lib.category===state.libraryCategory)) && (!q || [lib.name,lib.scientific,lib.category,lib.guideSummary||''].join(' ').toLowerCase().includes(q)));
    }

    function startOnboarding() { state.onboardingStep=2; state.draftCaretaker=state.caretaker; saveState(); render(); scrollTop(); }
    function onboardingBack() { if(state.onboardingStep>1){state.onboardingStep--;saveState();render();scrollTop();} }
    function chooseDraftCaretaker(key) { if(!caretakers[key]) return; state.draftCaretaker=key; saveState(); render(); }
    function caretakerNext() { state.caretaker=state.draftCaretaker; state.onboardingStep=3; saveState(); render(); scrollTop(); setTimeout(()=>document.getElementById('siteName')?.focus(),50); }
    function gardenNext() { const site=document.getElementById('siteName')?.value.trim(); const zone=document.getElementById('zoneName')?.value.trim(); if(!site||!zone){toast('Give your garden and first Zone a name 🌱');return;} state.siteName=site.slice(0,60); state.zoneName=zone.slice(0,60); state.zones=[state.zoneName]; state.onboardingStep=4; saveState(); render(); scrollTop(); }
    function finishOnboarding() { state.onboarded=true; state.screen='plants'; state.demoMode=false; saveState(); render(); scrollTop(); setTimeout(()=>toast(`${parent().label} is officially on plant duty 🌱`),100); }

    function onboardingShell(content,step) { return `<section class="onboarding-page"><div class="brandbar"><div class="brand"><div class="brand-mark">🌱</div><span>Plant Daddy</span></div><div class="build-tag">BUILD ${BUILD}</div></div><div class="progress">${[1,2,3,4].map(n=>`<span class="${n<=step?'on':''}"></span>`).join('')}</div>${content}</section>`; }
    function welcomeScreen() { return onboardingShell(`<div class="onboarding-card"><div class="hero-icon">🌿</div><div class="eyebrow">Welcome to Plant Daddy</div><h1>Keeping plants alive shouldn't be a full-time job.</h1><p class="lead">Start with a plant and your phone. Add sensors, intelligence and automation only when you want them.</p><div class="tagline">💦 Keep It Moist. <span>•</span> Daddy handles the rest.</div><div class="actions"><button class="button primary" onclick="startOnboarding()">Get Started</button><button class="button secondary" onclick="showModal('account')">I already have an account</button></div><div class="fineprint">Build ${BUILD} is local only. Nothing leaves this browser.</div></div>`,1); }
    function caretakerScreen() { return onboardingShell(`<div class="onboarding-card"><button class="text-button" onclick="onboardingBack()">‹ Back</button><div class="eyebrow">Choose your caretaker</div><h2>Who do you want looking after your plants?</h2><p class="lead">Pick whoever makes you happy. You can switch anytime.</p><div class="parent-grid">${Object.entries(caretakers).map(([key,p])=>`<button class="parent-choice ${state.draftCaretaker===key?'active':''}" onclick="chooseDraftCaretaker('${key}')"><span class="parent-avatar">${p.icon}</span><span class="parent-copy"><span class="parent-name">${p.label}</span><span class="parent-pronouns">${p.pronouns}</span><span class="parent-line">${p.line}</span></span><span class="selection-check">✓</span></button>`).join('')}</div><div class="actions"><button class="button primary" onclick="caretakerNext()">Continue with ${draftParent().label}</button></div></div>`,2); }
    function gardenScreenOnboarding() { return onboardingShell(`<div class="onboarding-card"><button class="text-button" onclick="onboardingBack()">‹ Back</button><div class="eyebrow">Create your garden</div><h2>Give your plants somewhere to live.</h2><p class="lead">A Garden is a property or site. Zones keep plants organized inside it.</p><div class="field-stack"><div class="field"><label>GARDEN / SITE NAME</label><input id="siteName" maxlength="60" value="${esc(state.siteName)}" placeholder="Home" autocomplete="off" /></div><div class="field"><label>FIRST ZONE</label><input id="zoneName" maxlength="60" value="${esc(state.zoneName)}" placeholder="My Plants" autocomplete="off" /></div></div><div class="setup-preview"><div class="crumb">🏡 <span>${esc(state.siteName)}</span> <span>›</span> 🌿 <span>${esc(state.zoneName)}</span></div></div><div class="actions"><button class="button primary" onclick="gardenNext()">Create Garden</button></div></div>`,3); }
    function finishScreen() { return onboardingShell(`<div class="onboarding-card"><div class="hero-icon">${parent().icon}</div><div class="eyebrow">You're ready</div><h2>${parent().label}'s got the garden.</h2><p class="lead">Consumer Alpha ${BUILD} is ready for local testing. Add plants, build care history, test the local brain and explore simulated smart care without connecting anything external.</p><div class="actions"><button class="button primary" onclick="finishOnboarding()">Open my Garden</button></div></div>`,4); }
    function renderOnboarding() { return state.onboardingStep===1?welcomeScreen():state.onboardingStep===2?caretakerScreen():state.onboardingStep===3?gardenScreenOnboarding():finishScreen(); }

    function shell(content) {
      return `<div class="page-shell"><div class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark">🌱</div><span>Plant Daddy</span></div><div class="top-actions"><div class="local-pill">🌱 ALPHA 1.1 • LOCAL</div><button class="icon-button" aria-label="Change appearance" title="Appearance: ${state.appearance}" onclick="cycleAppearance()">${themeIcon()}</button></div></div></div><section class="page">${content}</section><nav class="nav">${navButton('plants','🌱','Plants')}${navButton('care','💧','Care')}${navButton('add','➕','Add')}${navButton('garden','📊','Garden')}${navButton('parent','👤', parent().label)}</nav></div>`;
    }

    function navButton(key, icon, label) { return `<button class="${state.screen===key?'active':''}" onclick="go('${key}')"><span class="nav-icon">${icon}</span><span class="nav-label">${esc(label)}</span></button>`; }
    function go(screen) { selectedPlantId=null; state.screen=screen; saveState(); render(); scrollTop(); }

    function appSummary() {
      const counts = {happy:0, attention:0, critical:0};
      state.plants.forEach(p => counts[plantMetrics(p).status]++);
      return counts;
    }
    function plantCard(p) {
      const lib = libraryItem(p.libraryId); const m = plantMetrics(p);
      const statusClass = m.status==='critical' ? 'status-critical' : m.status==='attention' ? 'status-attention' : 'status-happy';
      const headline = m.status==='critical' ? 'Needs help soon' : m.status==='attention' ? 'Needs attention' : 'Looking good';
      const sub = m.moistureValue!=null ? `Moisture ${m.moistureValue}%` : `Target ${lib.moisture}`;
      return `<button class="card" style="width:100%; text-align:left" onclick="openPlant('${p.id}')"><div class="row"><div class="row-icon">${p.emoji}</div><div class="grow"><div class="card-title">${esc(p.name)}</div><div class="card-copy">${esc(p.zone)} • ${sub}</div></div><div class="chev">›</div></div><div class="card-copy ${statusClass}" style="margin-top:10px">${headline}</div>${m.reasons[0]?`<div class="card-copy">${esc(m.reasons[0])}</div>`:''}</button>`;
    }
    function loadDemoGarden() {
      const seeds = [
        ['coconut-palm','Coconut Palm','Tropical Patio','sensor',46,82],
        ['plumeria','Plumeria Bed West','Plumeria Bed','phone',31,96],
        ['hibiscus','Hibiscus Red','Front Pots','sensor',28,88],
        ['dragon-fruit','Dragon Fruit','Back Fence','watering',53,85]
      ];
      state.zones = Array.from(new Set(['Tropical Patio','Plumeria Bed','Front Pots','Back Fence']));
      state.zoneName = state.zones[0];
      state.siteName = state.siteName || 'Home';
      state.demoMode = true;
      state.plants = [];
      state.devices = [];
      state.logs = [];
      state.photos = [];
      seeds.forEach(([libraryId,name,zone,mode,moisture,temp]) => {
        const lib=libraryItem(libraryId); const id=uid('plant');
        const createdAt = new Date(Date.now() - (5+Math.random()*10)*86400000).toISOString();
        const plant = {id, libraryId, name, species:lib.scientific, variety:'', emoji:lib.emoji, zone, careMode:mode, moisture:null, temp, createdAt};
        state.plants.push(plant);
        if(mode==='sensor') state.devices.push({id:uid('device'), plantId:id, type:'sensor', label:'Demo Soil Sensor', status:'staged', simulated:true});
        if(mode==='watering') state.devices.push({id:uid('device'), plantId:id, type:'irrigation', label:'Demo Smart Watering', status:'staged', simulated:true});
        addLog(id,'added',`Added to ${state.siteName}`, null, createdAt, true);
        addLog(id,'watered','Initial demo watering', null, new Date(Date.now()-3*86400000).toISOString(), true);
        addLog(id,'moisture','Demo reading', moisture, new Date(Date.now()-1*86400000).toISOString(), true);
        if(libraryId==='hibiscus') addLog(id,'fertilized','MaxiGro', null, new Date(Date.now()-48*86400000).toISOString(), true);
        if(libraryId==='plumeria') addLog(id,'note','Soil has been getting hot by 1pm.', null, new Date(Date.now()-2*86400000).toISOString(), true);
      });
      saveState(); render(); toast('Demo Garden loaded 🌱');
    }
    function homeScreen() {
      const counts = appSummary();
      if (!state.plants.length) return shell(`<div class="release-pill">CONSUMER ALPHA 1.1</div><div class="eyebrow">Plant Daddy</div><h1 class="page-title">${parent().label}'s ready when you are.</h1><p class="page-sub">Start with one plant and your phone. Smart hardware can come later.</p><div class="card empty"><div class="empty-icon">🪴</div><h3>No plants yet.</h3><p>Your Garden is ready. Add your first plant to start care history, or load a synthetic garden to test Build ${BUILD}.</p><div class="actions inline"><button class="button primary" onclick="go('add')">Add a plant</button><button class="button secondary" onclick="loadDemoGarden()">Load Demo Garden</button></div></div><div class="card privacy-card"><div class="privacy-title">🔒 Clean-room build</div><div class="privacy-copy">Everything in this preview stays in this browser. There is no sign-in, cloud backend, live sensor connection, or path to Hub #0001.</div></div>`);
      const ranked=state.plants.map(p=>[p,plantMetrics(p)]).sort((a,b)=>({critical:0,attention:1,happy:2}[a[1].status]-({critical:0,attention:1,happy:2}[b[1].status])));
      const spotlight=ranked.find(([,m])=>m.status!=='happy');
      const recent=state.logs.slice().sort((a,b)=>+new Date(b.date)-+new Date(a.date))[0];
      const daddyMessage=spotlight ? `${spotlight[0].name}: ${spotlight[1].reasons[0] || 'worth a look.'}` : recent ? `Everything looks calm. Your latest logged activity was ${eventMeta[recent.type]?.[1]?.toLowerCase() || 'plant care'}.` : `Everything looks calm. Add a moisture reading or care event and ${parent().label} will start building context.`;
      return shell(`<div class="eyebrow">Plant Daddy</div><h1 class="page-title">${parent().label}'s watching ${state.plants.length} plant${state.plants.length===1?'':'s'}.</h1><p class="page-sub">One glance for what matters. Details stay underneath when you want them.</p><div class="summary-row"><div class="summary"><b>${counts.happy}</b><span>Happy</span></div><div class="summary"><b>${counts.attention}</b><span>Needs Attention</span></div><div class="summary"><b>${counts.critical}</b><span>Critical</span></div></div><div class="alpha-card"><div class="alpha-head"><div class="alpha-mark">✓</div><div><b>Consumer Alpha 1.1</b><span>Front-end product loop complete • still local only</span></div></div><div class="alpha-note">Plants, care, history, library, local intelligence, backups and the Demo Lab are all available before we connect accounts, cloud or real hardware.</div></div><div class="card insight-card"><div class="card-title">${parent().icon} ${parent().label} Says</div><div class="card-copy">${esc(daddyMessage)}</div>${state.ultraPreview && state.plants[0] ? `<div class="card-copy" style="margin-top:10px"><b>Ultra preview:</b> ${esc(ultraInsightFor(state.plants[0]))}</div>` : ''}<div class="actions"><button class="button secondary small" onclick="showModal('ultra','${state.plants[0]?.id || ''}')">Preview Ultra intelligence</button></div></div>${spotlight ? `<div class="card spotlight ${spotlight[1].status==='critical'?'critical':''}"><div class="row"><div class="row-icon">${spotlight[0].emoji}</div><div class="grow"><div class="card-title">${spotlight[1].status==='critical'?'Critical':'Needs attention'} — ${esc(spotlight[0].name)}</div><div class="card-copy">${esc(spotlight[1].reasons[0] || 'Worth a look.')}</div></div><button class="button secondary small" onclick="openPlant('${spotlight[0].id}')">View</button></div></div>` : `<div class="card"><div class="card-title">🌱 Everything looks okay.</div><div class="card-copy">Nothing is currently flagged by the local rules engine.</div></div>`}<div class="dashboard-actions"><button class="dashboard-action" onclick="go('add')"><span class="da-icon">➕</span><b>Add plant</b><span>Search the DCW-backed care library.</span></button><button class="dashboard-action" onclick="go('care')"><span class="da-icon">💧</span><b>Log care</b><span>Water, fertilize, read moisture, and more.</span></button><button class="dashboard-action" onclick="setGardenView('overview'); go('garden')"><span class="da-icon">🏡</span><b>Garden</b><span>Sites, Zones, and plant organization.</span></button><button class="dashboard-action" onclick="setGardenView('library'); go('garden')"><span class="da-icon">📚</span><b>Care Library</b><span>Browse structured DCW-backed plant profiles.</span></button></div><div class="section-head"><div class="section-title">Your plants</div><button class="text-button" onclick="go('add')">Add another</button></div>${state.plants.map(plantCard).join('')}`);
    }

    function careScreen() {
      if (!state.plants.length) return shell(`<div class="eyebrow">Care</div><h1 class="page-title">Nothing to care for yet.</h1><p class="page-sub">Add a plant first, then Plant Daddy can track watering, moisture, fertilizer, and history.</p><div class="card empty"><div class="empty-icon">💧</div><h3>Your care queue is empty.</h3><p>Once plants exist, this screen surfaces the ones worth your attention.</p><div class="actions"><button class="button primary" onclick="go('add')">Add a plant</button></div></div>`);

      const recent = state.logs.slice().sort((a,b)=>+new Date(b.date)-+new Date(a.date)).slice(0,8);
      return shell(`<div class="eyebrow">Care</div><h1 class="page-title">Needs Attention</h1><p class="page-sub">The things worth looking at — not every number.</p>${issues.length ? issues.map(([p,m]) => `<div class="card"><div class="row"><div class="row-icon">${p.emoji}</div><div class="grow"><div class="card-title">${esc(p.name)}</div><div class="card-copy">${esc(m.reasons[0] || 'Needs attention.')}</div></div><button class="button secondary small" onclick="openPlant('${p.id}')">View</button></div></div>`).join('') : `<div class="card"><div class="card-title">${parent().label}'s got it. 🌱</div><div class="card-copy">Nothing looks urgent right now.</div></div>`}<div class="section-head"><div class="section-title">Recent care activity</div></div><div class="card">${recent.length ? `<div class="timeline">${recent.map(renderTimelineItem).join('')}</div>` : `<div class="card-copy">No care activity logged yet.</div>`}</div>`);
    }

    function resetAddFlow(preserveScreen=true) { addFlow = { step:1, selectedLibraryId:null, query:'', category:'All', name:'', variety:'', zone:state.zones[0] || 'My Plants', careMode:'phone' }; if (!preserveScreen) state.screen='plants'; }

    function filteredLibrary() { const q=addFlow.query.trim().toLowerCase(); return plantLibrary.filter(p => (addFlow.category==='All' || (addFlow.category==='DCW Grows' ? p.dcwGuide : p.category===addFlow.category)) && (!q || [p.name,p.scientific,p.category].join(' ').toLowerCase().includes(q))); }
    function setAddQuery(value) { addFlow.query=value; render(); }
    function setCategory(value) { addFlow.category=value; render(); }
    function selectLibrary(id) { addFlow.selectedLibraryId=id; render(); }
    function libraryNext() { const lib=libraryItem(addFlow.selectedLibraryId); if(!lib){toast('Pick a plant first 🌱');return;} addFlow.name=addFlow.name||lib.name; addFlow.zone=addFlow.zone||state.zones[0]||'My Plants'; addFlow.step=2; render(); scrollTop(); setTimeout(()=>document.getElementById('plantName')?.focus(),60); }
    function detailsNext() { const name=document.getElementById('plantName')?.value.trim(); const variety=document.getElementById('plantVariety')?.value.trim(); const zone=document.getElementById('plantZone')?.value; if(!name){toast('Give your plant a name 🌱');return;} addFlow.name=name.slice(0,60); addFlow.variety=(variety||'').slice(0,60); addFlow.zone=zone||state.zones[0]; addFlow.step=3; render(); scrollTop(); }
    function chooseCareMode(mode) { addFlow.careMode=mode; render(); }
    function careModeNext() { addFlow.step=4; render(); scrollTop(); }
    function addBack() { if(addFlow.step>1){addFlow.step--; render(); scrollTop();} else go('plants'); }
    function saveNewPlant() { const lib=libraryItem(addFlow.selectedLibraryId); const id=uid('plant'); const plant={id,libraryId:lib.id,name:addFlow.name,species:lib.scientific,variety:addFlow.variety,emoji:lib.emoji,zone:addFlow.zone,careMode:addFlow.careMode,moisture:null,temp:null,createdAt:nowIso()}; state.plants.push(plant); if(addFlow.careMode==='sensor') state.devices.push({id:uid('device'),plantId:id,type:'sensor',label:'Demo Soil Sensor',status:'staged',simulated:true,current:true,battery:100,signal:'Excellent',assignedAt:nowIso()}); if(addFlow.careMode==='watering') state.devices.push({id:uid('device'),plantId:id,type:'irrigation',label:'Demo Smart Watering',status:'staged',simulated:true,current:true,battery:100,signal:'Excellent',assignedAt:nowIso()}); addLog(id,'added',`Added to ${state.siteName}`, null, plant.createdAt, true); saveState(); selectedPlantId=id; state.selectedPlantTab='today'; resetAddFlow(false); state.screen='plants'; render(); scrollTop(); toast(`${plant.name} is now in ${state.siteName} 🌱`); }

    function addFlowHeader() { return `<div class="flow-head"><button class="flow-back" onclick="addBack()">‹</button><div class="mini-progress">${[1,2,3,4].map(n=>`<span class="${n<=addFlow.step?'on':''}"></span>`).join('')}</div><div class="build-tag">${addFlow.step}/4</div></div>`; }
    function addLibraryStep() { const categories=['All','DCW Grows',...new Set(plantLibrary.map(p=>p.category))]; return `${addFlowHeader()}<div class="eyebrow">Add a plant</div><h1 class="page-title">What are we growing?</h1><p class="page-sub">Search the built-in Care Library or browse a category. ${plantLibrary.filter(p=>p.dcwGuide).length} DCW Growing Guide profiles are loaded locally.</p><div class="search-wrap"><span class="search-icon">⌕</span><input value="${esc(addFlow.query)}" oninput="setAddQuery(this.value)" placeholder="Search plumeria, dragon fruit, basil…" autocomplete="off" /></div><div class="chips">${categories.map(c=>`<button class="chip ${addFlow.category===c?'active':''}" onclick="setCategory('${c}')">${esc(c)}</button>`).join('')}</div><div class="library-grid">${filteredLibrary().map(p=>`<button class="library-card ${addFlow.selectedLibraryId===p.id?'selected':''}" onclick="selectLibrary('${p.id}')"><div class="library-emoji">${p.emoji}</div><div class="library-name">${esc(p.name)}</div><div class="library-scientific">${esc(p.scientific)}</div><div class="library-range">💧 ${esc(p.moisture)}</div>${p.dcwStore?'<div class="dcw-badge">🛍 DCW + Shop</div>':p.dcwGuide?'<div class="dcw-badge">🌱 DCW Guide</div>':''}</button>`).join('')}</div><div class="actions"><button class="button primary" ${addFlow.selectedLibraryId?'':'disabled'} onclick="libraryNext()">Continue</button></div>`; }
    function addDetailsStep() { const lib=libraryItem(addFlow.selectedLibraryId); return `${addFlowHeader()}<div class="eyebrow">Plant details</div><h1 class="page-title">Make it yours.</h1><div class="selected-species"><div class="library-emoji">${lib.emoji}</div><div><div class="card-title">${esc(lib.name)}</div><div class="card-copy"><i>${esc(lib.scientific)}</i> • Typical moisture ${esc(lib.moisture)}</div></div></div><div class="field-stack"><div class="field"><label>PLANT NAME</label><input id="plantName" maxlength="60" value="${esc(addFlow.name)}" placeholder="Mona" /></div><div class="field"><label>VARIETY / CULTIVAR — OPTIONAL</label><input id="plantVariety" maxlength="60" value="${esc(addFlow.variety)}" placeholder="Celadine, Thai Constellation…" /></div><div class="field"><label>ZONE</label><select id="plantZone">${state.zones.map(z=>`<option ${z===addFlow.zone?'selected':''}>${esc(z)}</option>`).join('')}</select></div></div><div class="actions"><button class="button primary" onclick="detailsNext()">Continue</button></div>`; }
    function addModeStep() { const modes=[['phone','🌱','Just my phone','I’ll log care myself. No hardware required.'],['sensor','📡','I have a sensor','Stage a sensor assignment now. No real device connects in this build.'],['watering','💦','I have smart watering','Stage irrigation for this plant. Automation stays disconnected.']]; return `${addFlowHeader()}<div class="eyebrow">How do you want to care for it?</div><h1 class="page-title">Start as simple as you want.</h1><p class="page-sub">You can upgrade the same plant later. You never recreate it just because the hardware changes.</p><div class="mode-grid">${modes.map(m=>`<button class="mode-card ${addFlow.careMode===m[0]?'active':''}" onclick="chooseCareMode('${m[0]}')"><span class="mode-icon">${m[1]}</span><span class="grow"><span class="parent-name">${m[2]}</span><span class="parent-line">${m[3]}</span></span><span class="selection-check">✓</span></button>`).join('')}</div>${addFlow.careMode!=='phone'?`<div class="hardware-note">🧪 UX simulation only. Build ${BUILD} creates a staged device record assigned to the plant — it does not pair, call an API, or touch Hub #0001.</div>`:''}<div class="actions"><button class="button primary" onclick="careModeNext()">Continue</button></div>`; }
    function addReviewStep() { const lib=libraryItem(addFlow.selectedLibraryId); const modeLabel={phone:'Just my phone',sensor:'Sensor — simulated',watering:'Smart watering — simulated'}[addFlow.careMode]; return `${addFlowHeader()}<div class="eyebrow">Ready to grow</div><h1 class="page-title">Add ${esc(addFlow.name)}.</h1><p class="page-sub">The plant becomes the permanent object. Any hardware is only assigned underneath it.</p><div class="selected-species"><div class="library-emoji">${lib.emoji}</div><div><div class="card-title">${esc(addFlow.name)}</div><div class="card-copy"><i>${esc(lib.scientific)}</i>${addFlow.variety?' • '+esc(addFlow.variety):''}</div></div></div><div class="review-grid"><div class="review-row"><span>Garden</span><b>${esc(state.siteName)}</b></div><div class="review-row"><span>Zone</span><b>${esc(addFlow.zone)}</b></div><div class="review-row"><span>Care setup</span><b>${esc(modeLabel)}</b></div><div class="review-row"><span>Typical moisture</span><b>${esc(lib.moisture)}</b></div></div><div class="actions"><button class="button primary" onclick="saveNewPlant()">Add to ${esc(state.siteName)}</button></div>`; }
    function addScreen() { return shell(addFlow.step===1 ? addLibraryStep() : addFlow.step===2 ? addDetailsStep() : addFlow.step===3 ? addModeStep() : addReviewStep()); }

    function addLog(plantId, type, note='', value=null, date=null, skipSave=false) { const entry={ id:uid('log'), plantId, type, date:date || nowIso(), note:(note||'').trim(), value:typeof value==='number'?value:null }; state.logs.push(entry); if(!skipSave) saveState(); return entry; }
    function saveLog(plantId, type) {
      const dateValue = document.getElementById('logDate')?.value;
      const note = document.getElementById('logNote')?.value.trim() || '';
      const valueField = document.getElementById('logValue');
      let numeric = null;
      if (type==='moisture') {
        numeric = Number(valueField?.value);
        if (!Number.isFinite(numeric) || numeric < 0 || numeric > 100) { toast('Enter a moisture reading from 0 to 100'); return; }
      } else if(type==='soiltemp') {
        numeric = Number(valueField?.value);
        if (!Number.isFinite(numeric) || numeric < -20 || numeric > 180) { toast('Enter a soil temperature from -20 to 180°F'); return; }
        const p=plantById(plantId); if(p) p.temp=numeric;
      }
      addLog(plantId, type, note, numeric, dateValue ? new Date(dateValue).toISOString() : nowIso());
      saveState(); closeModal(); render(); toast(type==='moisture' ? 'Manual moisture saved 📊' : type==='soiltemp' ? 'Soil temperature saved 🌡️' : 'Care event saved 🌱');
    }
    function movePlant(id) { const p=plantById(id); const zone=document.getElementById('moveZone')?.value; if(!p||!zone)return; p.zone=zone; addLog(id,'moved',`Moved to ${zone}`, null, nowIso(), true); saveState(); closeModal(); render(); toast(`${p.name} moved to ${zone}`); }
    function deletePlant(id) { const p=plantById(id); if(!p)return; state.plants=state.plants.filter(x=>x.id!==id); state.devices=state.devices.filter(d=>d.plantId!==id); state.logs=state.logs.filter(l=>l.plantId!==id); state.photos=state.photos.filter(ph=>ph.plantId!==id); selectedPlantId=null; saveState(); closeModal(); render(); scrollTop(); toast(`${p.name} removed locally`); }

    function setPlantTab(tab) { state.selectedPlantTab = tab; saveState(); render(); }
    function setHistoryWindow(days) { state.historyWindow = days; saveState(); render(); }
    function openPlant(id) { selectedPlantId=id; state.selectedPlantTab = state.selectedPlantTab || 'today'; render(); scrollTop(); }
    function closePlant() { selectedPlantId=null; render(); scrollTop(); }

    function renderTimelineItem(item) { const meta=eventMeta[item.type] || ['🌱', item.type]; return `<div class="timeline-item"><span class="timeline-dot"></span><div class="timeline-head"><b>${meta[0]} ${meta[1]}</b><span>${fmtDateTime(item.date)}</span>${item.value!=null?`<span>${item.value}${item.type==='soiltemp'?'°F':'%'}</span>`:''}</div>${item.note?`<div class="timeline-copy">${esc(item.note)}</div>`:''}</div>`; }
    function historySeries(plantId, days) { const now=Date.now(); return logsForPlant(plantId).filter(l => l.type==='moisture' && typeof l.value==='number' && (now - +new Date(l.date)) <= days*86400000).sort((a,b)=>+new Date(a.date)-+new Date(b.date)); }
    function renderChart(plantId, days) { const points=historySeries(plantId, days); if(!points.length) return `<div class="chart-empty">No moisture readings in the last ${days} days yet. Log one from Today or Care.</div>`; const vals=points.map(p=>p.value); const min=Math.max(0, Math.min(...vals, 0)); const max=Math.min(100, Math.max(...vals, 100)); const width=100, height=100; const coords=points.map((p,i)=>{ const x=points.length===1 ? 50 : i/(points.length-1)*width; const y=height - ((p.value-min)/(max-min || 1))*height; return [x,y,p]; }); const poly=coords.map(c=>`${c[0]},${c[1]}`).join(' '); return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="100" x2="100" y2="100" stroke="var(--line)" stroke-width="1"/><line x1="0" y1="50" x2="100" y2="50" stroke="var(--line)" stroke-width="0.7" stroke-dasharray="2 2"/><polyline fill="none" stroke="var(--accent)" stroke-width="2.2" points="${poly}"/>${coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="2.4" fill="var(--accent)"/>`).join('')}</svg><div class="chart-labels"><span>${fmtDate(points[0].date)}</span><span>${fmtDate(points[points.length-1].date)}</span></div></div>`; }

    function savePhoto(plantId, input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { toast('Pick an image file'); return; }
      const reader = new FileReader();
      reader.onload = () => { state.photos.push({ id:uid('photo'), plantId, date:nowIso(), src: String(reader.result), note:'' }); addLog(plantId, 'photo', 'Photo journal updated', null, nowIso(), true); saveState(); render(); toast('Photo saved locally 📸'); };
      reader.readAsDataURL(file);
    }

    function plantTodayTab(p, lib, m) {
      const intel=plantIntelligence(p), care=intel.care, soilTemp=lastSoilTempReading(p.id)?.value ?? p.temp ?? null;
      const freshness=intel.moisture ? `${Math.round(readingAgeHours(intel.moisture))}h ago` : 'No reading';
      return `<div class="metrics-grid"><div class="metric"><span>Moisture</span><b>${m.moistureValue!=null?m.moistureValue+'%':'—'}</b><small>Target ${care.moistureMin!=null?care.moistureMin+'–'+care.moistureMax+'%':'not set'}</small></div><div class="metric"><span>Soil Temp</span><b>${soilTemp!=null?soilTemp+'°F':'—'}</b><small>Manual / staged context</small></div><div class="metric"><span>Last Water</span><b>${m.daysSinceWater!=null?m.daysSinceWater+'d':'—'}</b><small>${esc(m.lastWaterLabel)}</small></div></div><div class="card brain-card"><div class="brain-head"><div class="brain-icon">🧠</div><div class="grow"><div class="card-title">${parent().label}'s local brain</div><div class="card-copy">${esc(intel.headline)}</div><span class="brain-status">${esc(intel.confidence)}</span></div></div>${renderMoistureRange(care,m.moistureValue)}<div class="brain-list">${intel.lines.map((line,i)=>`<div class="brain-line"><span>${i===0?'🌱':'•'}</span><span>${esc(line)}</span></div>`).join('')}</div><div class="verification-note">Deterministic Build ${BUILD} logic only. No AI API, weather service, cloud call, or live sensor is being used.</div></div><div class="card"><div class="section-title">Quick care</div><div class="quick-grid"><button class="quick-action" onclick="showModal('log', {id:'${p.id}', type:'watered'})"><b>💦 Water</b><span>Log a watering event.</span></button><button class="quick-action" onclick="showModal('log', {id:'${p.id}', type:'moisture'})"><b>📊 Moisture</b><span>Add a manual reading.</span></button><button class="quick-action" onclick="showModal('log', {id:'${p.id}', type:'soiltemp'})"><b>🌡️ Soil Temp</b><span>Add temperature context.</span></button><button class="quick-action" onclick="showModal('log', {id:'${p.id}', type:'fertilized'})"><b>🌱 Fertilize</b><span>Keep feeding history.</span></button><button class="quick-action" onclick="showModal('log', {id:'${p.id}', type:'note'})"><b>📝 Note</b><span>Remember what you noticed.</span></button><button class="quick-action" onclick="setPlantTab('history')"><b>📈 History</b><span>See the timeline and trends.</span></button></div></div>`;
    }

    function plantHistoryTab(p, lib, m) {
      const window = state.historyWindow;
      const timeline = timelineForPlant(p);
      return `<div class="card chart-card"><div class="section-title">Moisture history</div><div class="chart-toolbar"><button class="${window===7?'active':''}" onclick="setHistoryWindow(7)">7D</button><button class="${window===30?'active':''}" onclick="setHistoryWindow(30)">30D</button></div>${renderChart(p.id, window)}<div class="helper">Build ${BUILD} charts are driven only by your local manual moisture logs.</div></div><div class="card"><div class="section-title">Plant timeline</div><div class="timeline">${timeline.length ? timeline.map(renderTimelineItem).join('') : '<div class="card-copy">No history yet.</div>'}</div></div>`;
    }
    function plantCareTab(p, lib, m) {
      const care=effectiveCareProfile(p), source=librarySource(lib);
      return `<div class="card"><div class="row"><div class="grow"><div class="section-title">Structured Care Profile ${care.hasOverrides?'<span class="override-badge">PLANT OVERRIDE</span>':''}</div><div class="card-copy">Shared library targets stay separate from this plant's personal history.</div></div><button class="button secondary small" onclick="showModal('careProfile','${p.id}')">Customize</button></div><div style="margin-top:10px"><span class="profile-source ${source.className}">${esc(source.label)}</span></div>${lib.dcwStore?`<div class="dcw-note">🛍 <b>DCW Grows Store + Growing Guide</b> • This plant is connected to both the local guide and a DCW store product.</div>`:lib.dcwGuide?`<div class="dcw-note">🌱 <b>DCW Grows Growing Guide</b> • This care profile is seeded from the guide catalog already built by DCW Grows.</div>`:''}<div class="profile-grid"><div class="profile-item"><span>Moisture target</span><b>${care.moistureMin!=null?care.moistureMin+'–'+care.moistureMax+'%':'Not set'}</b></div><div class="profile-item"><span>Temperature</span><b>${care.tempMinF!=null?care.tempMinF+'–'+care.tempMaxF+'°F':'Not structured'}</b></div><div class="profile-item"><span>Light</span><b>${esc(care.light)}</b></div><div class="profile-item"><span>Soil</span><b>${esc(care.soil)}</b></div><div class="profile-item"><span>Watering</span><b>${esc(care.watering)}</b></div><div class="profile-item"><span>Fertilizer</span><b>${esc(care.fertilizer)}</b></div><div class="profile-item"><span>Environment</span><b>${esc(care.environment)}</b></div><div class="profile-item"><span>Seasonal</span><b>${esc(care.seasonal)}</b></div><div class="profile-item"><span>Toxicity</span><b>${esc(care.toxicity)}</b></div></div>${care.careNotes?`<div class="verification-note"><b>Care notes:</b> ${esc(care.careNotes)}</div>`:''}<div class="verification-note">Missing fields are intentionally marked unverified/not structured instead of silently guessed. We can validate and expand the library before public release.</div></div><div class="card"><div class="section-title">Care actions</div><div class="quick-grid"><button class="quick-action" onclick="showModal('log', {id:'${p.id}', type:'repotted'})"><b>🪴 Repot</b><span>Track pot or soil changes.</span></button><button class="quick-action" onclick="showModal('log', {id:'${p.id}', type:'pruned'})"><b>✂️ Prune</b><span>Log trims and shaping.</span></button><button class="quick-action" onclick="showModal('log', {id:'${p.id}', type:'pest'})"><b>🐞 Pest</b><span>Record treatments.</span></button><button class="quick-action" onclick="showModal('log', {id:'${p.id}', type:'harvested'})"><b>🧺 Harvest</b><span>Track edible yield.</span></button><button class="quick-action" onclick="showModal('log', {id:'${p.id}', type:'bloomed'})"><b>🌸 Bloom</b><span>Capture good plant moments.</span></button><button class="quick-action" onclick="showModal('log', {id:'${p.id}', type:'moved'})"><b>📦 Moved</b><span>Remember location changes.</span></button></div></div>`;
    }

    function plantDevicesTab(p) {
      const devs=devicesForPlant(p.id), current=devs.filter(d=>d.current!==false), retired=devs.filter(d=>d.current===false);
      return `<div class="card"><div class="section-head" style="margin-top:0"><div><div class="section-title">Devices</div><div class="card-copy">Hardware belongs to ${esc(p.name)}. ${esc(p.name)} does not belong to the hardware.</div></div><button class="button secondary small" onclick="showModal('deviceAssign','${p.id}')">Add staged</button></div>${current.length ? current.map(d=>`<div class="device-card"><div class="device-head"><span class="device-status"></span><div class="row-icon">${deviceIcon(d.type)}</div><div class="grow"><div class="card-title">${esc(d.label)}</div><div class="card-copy">Current • SIMULATED • no live connection</div></div></div><div class="device-meta"><span>Battery ${d.battery ?? 100}%</span><span>Signal ${esc(d.signal || 'Good')}</span><span>Assigned to ${esc(p.name)}</span></div>${d.type==='sensor'?`<div class="device-actions"><button class="button secondary small" onclick="showModal('replaceDevice','${p.id}')">Replace sensor</button></div>`:''}</div>`).join('') : `<div class="card-copy">No current hardware assigned. ${esc(p.name)} still keeps its identity and history.</div>`}${retired.length ? `<div class="section-head"><div class="section-title">Previous devices</div></div>${retired.map(d=>`<div class="device-card"><div class="device-head"><span class="device-status retired"></span><div class="row-icon">${deviceIcon(d.type)}</div><div class="grow"><div class="card-title">${esc(d.label)}</div><div class="card-copy">Retired • plant history preserved</div></div></div></div>`).join('')}`:''}<div class="history-proof">🔁 Sensor replacement never creates a new plant. Care logs, readings, photos, and the Plant ID stay attached to ${esc(p.name)}.</div></div>`;
    }

    function plantAutomationTab(p) {
      const selected=automationModeFor(p.id), irrigation=hasIrrigation(p.id);
      const options=[
        ['observe','👀','Observe','Plant Daddy watches. No recommendations or actions.'],
        ['recommend','🧠','Recommend',`${parent().label} can suggest what should happen. Nothing runs.`],
        ['approve','👍','Approve','Preview an approval workflow before any staged watering action.'],
        ['auto','💦','Auto','Preview autonomous care behind safety rules. Still no real action.']
      ];
      return `<div class="card"><div class="section-title">Automation</div><div class="card-copy">Choose how much control you would eventually allow for ${esc(p.name)}. Every mode in Build ${BUILD} is UI simulation only.</div><div class="automation-grid">${options.map(([key,icon,title,copy])=>{const disabled=(key==='approve'||key==='auto')&&!irrigation; return `<button class="automation-choice ${selected===key?'active':''}" ${disabled?'disabled':''} onclick="setAutomationMode('${p.id}','${key}')"><span class="auto-icon">${icon}</span><span class="grow"><b>${title}</b><span>${copy}${disabled?' Stage an irrigation device first.':''}</span></span><span class="selection-check">✓</span></button>`}).join('')}</div><div class="section-head"><div class="section-title">Safety preview</div></div><div class="safety-grid"><div class="safety-item"><b>⏱ Max runtime</b><span>Hard stop before overwatering.</span></div><div class="safety-item"><b>🕒 Minimum gap</b><span>No repeat watering too soon.</span></div><div class="safety-item"><b>📡 Fresh reading</b><span>Require current sensor data.</span></div><div class="safety-item"><b>🌧 Rain suppression</b><span>Future weather-aware skip.</span></div><div class="safety-item"><b>🛑 Manual override</b><span>You can always stop automation.</span></div><div class="safety-item"><b>⚠️ Fail safe</b><span>Uncertain state means no watering.</span></div></div><div class="demo-callout">Selected preview: <b>${selected}</b>. No irrigation, MQTT, Hub, API, or device command exists in this file.</div></div><div class="card ultra-card"><div class="card-title">🧠 Plant Daddy Ultra</div><div class="card-copy">Your plants already generate data. Ultra understands it.</div><div class="ultra-price">$1.99 <span>/ month target</span></div><div class="actions"><button class="button secondary" onclick="showModal('ultra','${p.id}')">Preview ${parent().label}'s analysis</button></div></div>`;
    }

    function plantPhotosTab(p) { const photos=photosForPlant(p.id); return `<div class="card"><div class="section-title">Photo journal</div><div class="card-copy">Snap progress over time. Photos stay only in this browser in Build ${BUILD}.</div><div class="actions"><label class="button secondary" style="display:grid; place-items:center; cursor:pointer;">Add photo<input type="file" accept="image/*" style="display:none" onchange="savePhoto('${p.id}', this)" /></label></div>${photos.length ? `<div class="photo-grid">${photos.map(photo=>`<div class="photo-card"><img src="${photo.src}" alt="${esc(p.name)} photo"/><div>${fmtDateTime(photo.date)}</div></div>`).join('')}</div>` : `<div class="card-copy" style="margin-top:12px">No photos yet. Add one to start a local visual history.</div>`}</div>`; }

    function plantDetailScreen() {
      const p=plantById(selectedPlantId); if(!p){ selectedPlantId=null; return homeScreen(); }
      const m=plantMetrics(p); const tabs=['today','history','care','devices','automation','photos']; const labels={today:'Today', history:'History', care:'Care', devices:'Devices', automation:'Automation', photos:'Photos'};
      let body='';
      if (state.selectedPlantTab==='today') body = plantTodayTab(p, libraryItem(p.libraryId), m);
      else if (state.selectedPlantTab==='history') body = plantHistoryTab(p, libraryItem(p.libraryId), m);
      else if (state.selectedPlantTab==='care') body = plantCareTab(p, libraryItem(p.libraryId), m);
      else if (state.selectedPlantTab==='devices') body = plantDevicesTab(p);
      else if (state.selectedPlantTab==='automation') body = plantAutomationTab(p);
      else body = plantPhotosTab(p);
