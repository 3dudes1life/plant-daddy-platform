    const labScenarios={
      healthy:{icon:'🌱',title:'Healthy day',copy:'Normal moisture, normal temperature, everything online.'},
      drying:{icon:'📉',title:'Drying fast',copy:'Moisture falling much faster than this plant normally should.'},
      dry:{icon:'💦',title:'Dry now',copy:'Below the plant’s preferred moisture range.'},
      heat:{icon:'☀️',title:'99°F soil',copy:'Heat stress without automatically assuming water is the answer.'},
      battery:{icon:'🔋',title:'Low battery',copy:'Sensor is healthy, but its battery is nearly done.'},
      offline:{icon:'📡',title:'Sensor offline',copy:'Fresh data is unavailable, so automation must fail safe.'},
      rain:{icon:'🌧️',title:'Rain incoming',copy:'Plant is dry, but rain suppression should stop watering.'},
      flowfail:{icon:'⚠️',title:'Flow failure',copy:'Watering cannot be confirmed, so automation pauses.'}
    };
    function labPlant(){ return state.plants.find(p=>p.id===state.demoLab.plantId) || null; }
    function labLibrary(){ const p=labPlant(); return p ? libraryItem(p.libraryId) : libraryItem('plumeria'); }
    function labName(){ return labPlant()?.name || 'Lab Plumeria'; }
    function labCare(){ const p=labPlant(); return p ? effectiveCareProfile(p) : structuredLibraryProfile(labLibrary()); }
    function labTarget(){ const c=labCare(); return {min:Number.isFinite(Number(c.moistureMin))?Number(c.moistureMin):25,max:Number.isFinite(Number(c.moistureMax))?Number(c.moistureMax):45,tmax:Number.isFinite(Number(c.tempMaxF))?Number(c.tempMaxF):90}; }
    function labSetPlant(id){ state.demoLab.plantId=id||''; labApplyScenario(state.demoLab.scenario||'healthy',false); saveState(); render(); }
    function labSetMode(mode){ if(!['observe','recommend','approve','auto'].includes(mode))return; state.demoLab.mode=mode; labPush(`Automation mode set to ${mode}.`,'🤖'); saveState(); render(); }
    function labPush(message,icon='🧪'){ state.demoLab.timeline=[{id:uid('lab'),date:nowIso(),icon,message},...(state.demoLab.timeline||[])].slice(0,30); state.demoLab.lastAction=message; }
    function labApplyScenario(key,rerender=true){
      const t=labTarget(), mid=Math.round((t.min+t.max)/2), l=state.demoLab; l.scenario=key;
      Object.assign(l,{moisture:mid,soilTempF:Math.min(t.tmax-5,80),dryRate:3.2,battery:92,sensorOnline:true,signal:'Excellent',rain:false,flow:'ok'});
      if(key==='drying') Object.assign(l,{moisture:Math.min(t.max, t.min+8),soilTempF:Math.min(t.tmax+2,94),dryRate:8.4});
      if(key==='dry') Object.assign(l,{moisture:Math.max(0,t.min-6),soilTempF:88,dryRate:6.8});
      if(key==='heat') Object.assign(l,{moisture:mid,soilTempF:99,dryRate:8.1});
      if(key==='battery') Object.assign(l,{battery:12});
      if(key==='offline') Object.assign(l,{sensorOnline:false,signal:'Offline'});
      if(key==='rain') Object.assign(l,{moisture:Math.max(0,t.min-4),rain:true,dryRate:5.4});
      if(key==='flowfail') Object.assign(l,{moisture:Math.max(0,t.min-5),flow:'failed',dryRate:6.1});
      labPush(`${labScenarios[key]?.title||'Scenario'} loaded for ${labName()}.`,'🧪'); saveState(); if(rerender)render();
    }
    function labUpdate(field,value){ const l=state.demoLab; if(['moisture','soilTempF','dryRate','battery'].includes(field)) l[field]=Number(value); else l[field]=value; l.scenario='custom'; saveState(); render(); }
    function labToggle(field){ state.demoLab[field]=!state.demoLab[field]; state.demoLab.scenario='custom'; if(field==='sensorOnline') state.demoLab.signal=state.demoLab.sensorOnline?'Excellent':'Offline'; saveState(); render(); }
    function labToggleFlow(){ state.demoLab.flow=state.demoLab.flow==='ok'?'failed':'ok'; state.demoLab.scenario='custom'; saveState(); render(); }
    function labEvaluation(){
      const l=state.demoLab,t=labTarget(),reasons=[]; let severity='happy',shouldWater=false,blocked='';
      if(!l.sensorOnline){severity='critical';reasons.push('Sensor has stopped reporting. Current moisture cannot be trusted.');blocked='Fresh sensor reading required.';}
      if(l.battery<=20){ if(severity==='happy')severity='attention'; reasons.push(`Sensor battery is low at ${Math.round(l.battery)}%.`); }
      if(l.soilTempF>t.tmax){ if(severity==='happy')severity='attention'; reasons.push(`Soil temperature is ${Math.round(l.soilTempF)}°F, above this profile’s ${t.tmax}°F upper target.`); }
      if(l.moisture<t.min){ shouldWater=true; if(severity==='happy')severity='attention'; reasons.push(`Moisture is ${Math.round(l.moisture)}%, below the ${t.min}–${t.max}% preferred range.`); }
      else if(l.moisture>t.max){ if(severity==='happy')severity='attention'; reasons.push(`Moisture is ${Math.round(l.moisture)}%, above the preferred range.`); }
      if(l.dryRate>=7){ if(severity==='happy')severity='attention'; reasons.push(`Dry-down is fast at about ${Number(l.dryRate).toFixed(1)} points/day.`); }
      if(l.rain && shouldWater){blocked='Rain suppression is active.';reasons.push('Rain is incoming, so watering should wait.');}
      if(l.flow==='failed'){severity='critical';blocked='Irrigation flow could not be confirmed.';reasons.push('Flow verification failed. Automatic watering is paused.');}
      if(!reasons.length) reasons.push('Readings are inside the current care profile and hardware looks healthy.');
      let forecast=''; if(l.moisture>=t.min && l.dryRate>0){const days=(l.moisture-t.min)/l.dryRate;if(days<=3)forecast=`At this dry-down rate, the lower target could be reached in about ${days<1?Math.max(1,Math.round(days*24))+' hours':days.toFixed(1)+' days'}.`;}
      let decision='Watching only. No recommendation or action.';
      if(l.mode==='recommend') decision=shouldWater&&!blocked?'Recommend watering this plant.':blocked?`Do not water: ${blocked}`:'No watering recommendation right now.';
      if(l.mode==='approve') decision=shouldWater&&!blocked?'Watering is recommended and waiting for your approval.':blocked?`Approval is blocked: ${blocked}`:'Nothing needs approval right now.';
      if(l.mode==='auto') decision=shouldWater&&!blocked?'AUTO is allowed to run a simulated watering decision.':blocked?`AUTO is blocked: ${blocked}`:'AUTO would take no action right now.';
      return {severity,reasons,shouldWater,blocked,forecast,decision,target:t};
    }
    function labRunDecision(){
      const l=state.demoLab,e=labEvaluation();
      if(l.mode==='observe'){labPush('Observe mode watched the conditions and took no action.','👀');}
      else if(l.mode==='recommend'){labPush(e.shouldWater&&!e.blocked?'Recommendation created: water this plant.':e.blocked?`Recommendation: do not water — ${e.blocked}`:'Recommendation: no watering needed.','🧠');}
      else if(l.mode==='approve'){labPush(e.shouldWater&&!e.blocked?'Approval requested for simulated watering.':e.blocked?`Approval blocked — ${e.blocked}`:'No approval needed.','👍');}
      else if(l.mode==='auto'){
        if(e.shouldWater&&!e.blocked){const before=l.moisture;l.moisture=Math.min(100,Math.max(e.target.min+10,Math.min(e.target.max,l.moisture+20)));labPush(`AUTO simulated watering: ${Math.round(before)}% → ${Math.round(l.moisture)}%. No device command was sent.`,'💦');}
        else labPush(e.blocked?`AUTO failed safe — ${e.blocked}`:'AUTO checked conditions and did nothing.','🛑');
      }
      saveState();render();
    }
    function labApprove(){ const e=labEvaluation(),l=state.demoLab;if(l.mode!=='approve'){toast('Switch to Approve mode first');return;}if(!e.shouldWater||e.blocked){labPush(e.blocked?`Manual approval blocked — ${e.blocked}`:'No watering action is currently proposed.','🛑');saveState();render();return;}const before=l.moisture;l.moisture=Math.min(100,Math.max(e.target.min+10,Math.min(e.target.max,l.moisture+20)));labPush(`You approved simulated watering: ${Math.round(before)}% → ${Math.round(l.moisture)}%.`,'👍');saveState();render(); }
    function labSkip(){ labPush('You skipped the proposed watering.','⏭️');saveState();render(); }
    function resetDemoLab(){ state.demoLab={plantId:'',scenario:'healthy',mode:'observe',moisture:50,soilTempF:80,dryRate:3.2,battery:100,sensorOnline:true,signal:'Excellent',rain:false,flow:'ok',lastAction:'',timeline:[]}; labApplyScenario('healthy',false); saveState(); render(); toast('Demo Lab reset 🧪'); }
    function demoLabScreen(){
      const l=state.demoLab,e=labEvaluation(),t=e.target,scenarios=Object.entries(labScenarios), plantOptions=state.plants.map(p=>`<option value="${p.id}" ${l.plantId===p.id?'selected':''}>${esc(p.name)} • ${esc(p.zone)}</option>`).join('');
      const modeCopy={observe:'Watch only',recommend:'Suggest what should happen',approve:'Ask before simulated watering',auto:'Act inside simulated safety rules'};

      const poly=coords.map(c=>`${c[0]},${c[1]}`).join(' '); let band='';
      if(care?.moistureMin!=null&&care?.moistureMax!=null){const yTop=height-care.moistureMax, yBottom=height-care.moistureMin;band=`<rect class="chart-target" x="0" y="${yTop}" width="100" height="${Math.max(1,yBottom-yTop)}"/>`;}
      return `<div class="chart-wrap"><svg class="chart-svg" viewBox="0 0 100 100" preserveAspectRatio="none">${band}<line x1="0" y1="100" x2="100" y2="100" stroke="var(--line)" stroke-width="1"/><line x1="0" y1="50" x2="100" y2="50" stroke="var(--line)" stroke-width="0.7" stroke-dasharray="2 2"/><polyline fill="none" stroke="var(--accent)" stroke-width="2.2" points="${poly}"/>${coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="2.4" fill="var(--accent)"/>`).join('')}</svg><div class="chart-labels"><span>${fmtDate(points[0].date)}</span><span>${fmtDate(points[points.length-1].date)}</span></div></div>`;
    }
    function plantHistoryTab(p,lib,m){
      const window=state.historyWindow, timeline=timelineForPlant(p), readings=historySeries(p.id,window), rate=dryRatePerDay(p.id), streak=careStreak(p.id);
      const avg=readings.length?Math.round(readings.reduce((s,x)=>s+x.value,0)/readings.length):null;
      return `<div class="card chart-card"><div class="section-title">Moisture history</div><div class="chart-toolbar"><button class="${window===7?'active':''}" onclick="setHistoryWindow(7)">7D</button><button class="${window===30?'active':''}" onclick="setHistoryWindow(30)">30D</button><button class="${window===90?'active':''}" onclick="setHistoryWindow(90)">90D</button><button class="${window===365?'active':''}" onclick="setHistoryWindow(365)">1Y</button></div>${renderChart(p.id,window)}<div class="history-insights"><div class="history-stat"><b>${readings.length}</b><span>readings in view</span></div><div class="history-stat"><b>${avg!=null?avg+'%':'—'}</b><span>average moisture</span></div><div class="history-stat"><b>${rate!=null?rate.toFixed(1)+'/day':'—'}</b><span>recent dry-down</span></div><div class="history-stat"><b>${streak}d</b><span>care streak</span></div></div><div class="helper">Green shading is this plant's current target range. All chart data is local.</div></div><div class="card"><div class="section-title">Plant timeline</div><div class="timeline">${timeline.length?timeline.map(renderTimelineItem).join(''):'<div class="card-copy">No history yet.</div>'}</div></div>`;
    }
    function plantPhotosTab(p){ const photos=photosForPlant(p.id); return `<div class="card"><div class="section-title">Photo journal</div><div class="card-copy">Photos are resized before local storage to keep this browser preview lighter. The chosen avatar is used on Plant Daddy cards.</div><div class="actions"><label class="button secondary" style="display:grid;place-items:center;cursor:pointer;">Add photo<input type="file" accept="image/*" style="display:none" onchange="savePhoto('${p.id}',this)" /></label></div>${photos.length?`<div class="photo-grid">${photos.map(photo=>`<div class="photo-card"><img src="${photo.src}" alt="${esc(p.name)} photo"/><div>${fmtDateTime(photo.date)}</div><div class="photo-actions"><button onclick="setPhotoAsAvatar('${photo.id}')">${p.avatarPhotoId===photo.id?'✓ Avatar':'Use as avatar'}</button><button onclick="deletePhoto('${photo.id}')">Remove</button></div></div>`).join('')}</div>`:`<div class="empty-search"><div class="big">📸</div><b>No photos yet.</b><div class="card-copy">Add one to start a visual growth history.</div></div>`}</div>`; }

    function shell(content){
      const noticeCount=notificationItems().length;
      return `<div class="page-shell"><div class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark">🌱</div><span>Plant Daddy</span></div><div class="top-actions topbar-tools"><div class="local-pill">🌱 ALPHA 1.1 • LOCAL</div><button class="icon-button top-icon" aria-label="Notifications" title="Local notifications" onclick="openNotifications()">🔔${noticeCount?`<span class="notice-dot">${noticeCount>9?'9+':noticeCount}</span>`:''}</button><button class="icon-button" aria-label="Help" title="Plant Daddy 101" onclick="openHelp()">?</button><button class="icon-button" aria-label="Change appearance" title="Appearance: ${state.appearance}" onclick="cycleAppearance()">${themeIcon()}</button></div></div></div><section class="page">${content}</section><nav class="nav">${navButton('plants','🌱','Plants')}${navButton('care','💧','Care')}${navButton('add','➕','Add')}${navButton('garden','📊','Garden')}${navButton('parent','👤',parent().label)}</nav></div>`;
    }
    function plantCard(p){
      const lib=libraryItem(p.libraryId),m=plantMetrics(p); const statusClass=m.status==='critical'?'status-critical':m.status==='attention'?'status-attention':'status-happy'; const headline=m.status==='critical'?'Needs help soon':m.status==='attention'?'Needs attention':'Looking good'; const sub=m.moistureValue!=null?`Moisture ${m.moistureValue}%`:`Target ${lib.moisture}`;
      return `<button class="card" style="width:100%;text-align:left" onclick="openPlant('${p.id}')"><div class="row">${avatarForPlant(p)}<div class="grow"><div class="card-title">${esc(p.name)}</div><div class="card-copy">${esc(p.zone)} • ${sub}</div></div><div class="chev">›</div></div><div class="card-copy ${statusClass}" style="margin-top:10px">${headline}</div>${m.reasons[0]?`<div class="card-copy">${esc(m.reasons[0])}</div>`:''}</button>`;
    }
    function homeScreen(){
      const counts=appSummary(); if(!state.plants.length)return shell(`<div class="release-pill">CONSUMER ALPHA 1.1</div><div class="eyebrow">Plant Daddy</div><h1 class="page-title">${parent().label}'s ready when you are.</h1><p class="page-sub">Start with one plant and your phone. Smart hardware can come later.</p><div class="card empty"><div class="empty-icon">🪴</div><h3>No plants yet.</h3><p>Your Garden is ready. Add your first plant to start care history, or load a synthetic garden to test Build ${BUILD}.</p><div class="actions inline"><button class="button primary" onclick="go('add')">Add a plant</button><button class="button secondary" onclick="loadDemoGarden()">Load Demo Garden</button></div></div><div class="card"><div class="card-title">Need the 30-second tour?</div><div class="card-copy">See how Plants, Care, Garden, devices and Ultra fit together.</div><div class="actions"><button class="button secondary" onclick="openHelp()">Plant Daddy 101</button></div></div><div class="card privacy-card"><div class="privacy-title">🔒 Clean-room build</div><div class="privacy-copy">Everything in this preview stays in this browser. There is no sign-in, cloud backend, live sensor connection, or path to Hub #0001.</div></div>`);
      const ranked=state.plants.map(p=>[p,plantMetrics(p)]).sort((a,b)=>statusRank(a[1].status)-statusRank(b[1].status));
      const spotlight=ranked.find(([,m])=>m.status!=='happy'), recent=state.logs.slice().sort((a,b)=>+new Date(b.date)-+new Date(a.date))[0];
      const parentMessage=spotlight?`${spotlight[0].name}: ${spotlight[1].reasons[0]||'worth a look.'}`:recent?`Everything looks calm. Your latest logged activity was ${eventMeta[recent.type]?.[1]?.toLowerCase()||'plant care'}.`:`Everything looks calm. Add a moisture reading or care event and ${parent().label} will start building context.`;
      const results=filteredHomePlants();
      return shell(`<div class="eyebrow">Plant Daddy</div><h1 class="page-title">${parent().label}'s watching ${state.plants.length} plant${state.plants.length===1?'':'s'}.</h1><p class="page-sub">One glance for what matters. Search, filter, then dive in only when you want to.</p><div class="summary-row"><div class="summary"><b>${counts.happy}</b><span>Happy</span></div><div class="summary"><b>${counts.attention}</b><span>Needs Attention</span></div><div class="summary"><b>${counts.critical}</b><span>Critical</span></div></div><div class="alpha-card"><div class="alpha-head"><div class="alpha-mark">✓</div><div><b>Consumer Alpha 1.1</b><span>Front-end product loop complete • still local only</span></div></div><div class="alpha-note">Plants, care, history, library, local intelligence, backups and the Demo Lab are all available before we connect accounts, cloud or real hardware.</div></div><div class="card insight-card"><div class="card-title">${parent().icon} ${parent().label} Says</div><div class="card-copy">${esc(parentMessage)}</div>${state.ultraPreview&&state.plants[0]?`<div class="card-copy" style="margin-top:10px"><b>Ultra preview:</b> ${esc(ultraInsightFor(state.plants[0]))}</div>`:''}</div><div class="dashboard-actions"><button class="dashboard-action" onclick="go('add')"><span class="da-icon">➕</span><b>Add plant</b><span>Use the local Care Library.</span></button><button class="dashboard-action" onclick="go('care')"><span class="da-icon">💧</span><b>Care queue</b><span>See what needs attention.</span></button><button class="dashboard-action" onclick="setGardenView('overview');go('garden')"><span class="da-icon">🏡</span><b>Garden</b><span>Organize Sites and Zones.</span></button><button class="dashboard-action" onclick="openNotifications()"><span class="da-icon">🔔</span><b>Notices</b><span>${notificationItems().length} local notification${notificationItems().length===1?'':'s'}.</span></button></div><div class="section-head"><div class="section-title">Your plants</div><button class="text-button" onclick="go('add')">Add another</button></div><div class="home-toolbar"><div class="search-wrap"><span class="search-icon">⌕</span><input id="homeSearch" value="${esc(state.homeQuery)}" oninput="setHomeQuery(this.value)" placeholder="Search plants, zones, species…" autocomplete="off"/></div><div class="filter-row">${[['all','All'],['happy','Happy'],['attention','Attention'],['critical','Critical']].map(([k,l])=>`<button class="${state.homeFilter===k?'active':''}" onclick="setHomeFilter('${k}')">${l}</button>`).join('')}</div></div>${results.length?results.map(plantCard).join(''):`<div class="card empty-search"><div class="big">🔎</div><h3>No plants match.</h3><p>Try another search or clear the status filter.</p><button class="button secondary" onclick="state.homeQuery='';state.homeFilter='all';saveState();render()">Clear filters</button></div>`}<div class="build-ribbon">Consumer Alpha ${BUILD} • local-only front-end freeze</div>`);
    }
    function careScreen(){
      if(!state.plants.length)return shell(`<div class="eyebrow">Care</div><h1 class="page-title">Nothing to care for yet.</h1><p class="page-sub">Add a plant first, then Plant Daddy can track watering, moisture, fertilizer and history.</p><div class="card empty"><div class="empty-icon">💧</div><h3>Your care queue is empty.</h3><div class="actions"><button class="button primary" onclick="go('add')">Add a plant</button></div></div>`);
      const issues=state.plants.map(p=>[p,plantMetrics(p)]).filter(([,m])=>m.status!=='happy'||m.reasons.length).sort((a,b)=>statusRank(a[1].status)-statusRank(b[1].status)); const recent=state.logs.slice().sort((a,b)=>+new Date(b.date)-+new Date(a.date)).slice(0,8);
      return shell(`<div class="eyebrow">Care</div><h1 class="page-title">${issues.length?'Needs Attention':'All caught up'}</h1><p class="page-sub">The stuff worth looking at — not every number.</p>${issues.length?issues.map(([p,m])=>`<div class="card"><div class="row">${avatarForPlant(p)}<div class="grow"><div class="card-title">${esc(p.name)}</div><div class="card-copy">${esc(m.reasons[0]||'Needs attention.')}</div></div><button class="button secondary small" onclick="openPlant('${p.id}')">View</button></div><div class="actions inline"><button class="button secondary small" onclick="showModal('log',{id:'${p.id}',type:'watered'})">💦 Water</button><button class="button secondary small" onclick="showModal('log',{id:'${p.id}',type:'moisture'})">📊 Reading</button></div></div>`).join(''):`<div class="card"><div class="card-title">${parent().label}'s got it. 🌱</div><div class="card-copy">Nothing looks urgent right now.</div></div>`}<div class="section-head"><div class="section-title">Recent care activity</div></div><div class="card">${recent.length?`<div class="timeline">${recent.map(renderTimelineItem).join('')}</div>`:`<div class="card-copy">No care activity logged yet.</div>`}</div>`);
    }
    function plantDetailScreen(){
      const p=plantById(selectedPlantId); if(!p){selectedPlantId=null;return homeScreen();} const m=plantMetrics(p),tabs=['today','history','care','devices','automation','photos'],labels={today:'Today',history:'History',care:'Care',devices:'Devices',automation:'Automation',photos:'Photos'}; let body='';
      if(state.selectedPlantTab==='today')body=plantTodayTab(p,libraryItem(p.libraryId),m); else if(state.selectedPlantTab==='history')body=plantHistoryTab(p,libraryItem(p.libraryId),m); else if(state.selectedPlantTab==='care')body=plantCareTab(p,libraryItem(p.libraryId),m); else if(state.selectedPlantTab==='devices')body=plantDevicesTab(p); else if(state.selectedPlantTab==='automation')body=plantAutomationTab(p); else body=plantPhotosTab(p);
      return shell(`<button class="text-button" onclick="closePlant()">‹ All Plants</button><div class="detail-hero">${avatarForPlant(p,'detail-avatar')}<div class="detail-title">${esc(p.name)}</div><div class="detail-species">${esc(p.species)}${p.variety?' • '+esc(p.variety):''}</div><div class="badge-row"><span class="badge">🏡 ${esc(state.siteName)}</span><span class="badge">🌿 ${esc(p.zone)}</span><span class="badge">${p.careMode==='phone'?'📱 Manual':p.careMode==='sensor'?'📡 Sensor staged':'💦 Watering staged'}</span></div><div class="metrics-grid"><div class="metric"><span>Status</span><b class="${m.status==='critical'?'status-critical':m.status==='attention'?'status-attention':'status-happy'}">${m.status[0].toUpperCase()+m.status.slice(1)}</b></div><div class="metric"><span>Current moisture</span><b>${m.moistureValue!=null?m.moistureValue+'%':'—'}</b></div><div class="metric"><span>Care streak</span><b>${careStreak(p.id)}d</b></div></div></div><div class="tab-row">${tabs.map(tab=>`<button class="tab ${state.selectedPlantTab===tab?'active':''}" onclick="setPlantTab('${tab}')">${labels[tab]}</button>`).join('')}</div>${body}<div class="plant-actions"><button class="button secondary" onclick="renderEditPlant('${p.id}')">Edit plant</button><button class="button secondary" onclick="showModal('move','${p.id}')">Move plant</button></div><button class="danger-button" onclick="showModal('delete','${p.id}')">Remove ${esc(p.name)}</button>`);
    }
    function gardenOverview(){
      return `<div class="eyebrow">Garden</div><h1 class="page-title">Your growing space.</h1><p class="page-sub">Site → Zones → Plants. Reorder and rename Zones without rebuilding any plant.</p>${gardenTabs()}<div class="hierarchy-site"><div class="hierarchy-title"><span class="row-icon">🏡</span><div><div>${esc(state.siteName)}</div><div class="card-copy">1 Site • ${state.zones.length} Zone${state.zones.length===1?'':'s'} • ${state.plants.length} plant${state.plants.length===1?'':'s'}</div></div></div><div class="hierarchy-line">${state.zones.map((z,i)=>`<div class="zone-row v08"><span>🌿</span><b>${esc(z)}</b><span class="zone-count">${state.plants.filter(p=>p.zone===z).length} plant${state.plants.filter(p=>p.zone===z).length===1?'':'s'}</span><div class="zone-tools"><button class="mini-icon-btn" title="Move up" ${i===0?'disabled':''} onclick="event.stopPropagation();moveZoneOrder(decodeURIComponent('${encodeURIComponent(z)}'),-1)">↑</button><button class="mini-icon-btn" title="Move down" ${i===state.zones.length-1?'disabled':''} onclick="event.stopPropagation();moveZoneOrder(decodeURIComponent('${encodeURIComponent(z)}'),1)">↓</button><button class="mini-icon-btn" title="Rename" onclick="event.stopPropagation();renameZonePrompt(decodeURIComponent('${encodeURIComponent(z)}'))">✎</button><button class="zone-open" title="Open Zone" onclick="openZone(decodeURIComponent('${encodeURIComponent(z)}'))">›</button></div></div>`).join('')}</div><button class="text-button" onclick="toggleGardenEdit()">Edit Site name</button><div id="gardenEdit" class="edit-panel"><div class="field"><label>GARDEN / SITE</label><input id="editSite" value="${esc(state.siteName)}" maxlength="60"/></div><div class="actions"><button class="button primary" onclick="saveGardenEdit()">Save locally</button></div></div></div><div class="section-head"><div class="section-title">Add Zone</div></div><div class="inline-add"><input id="newZone" maxlength="60" placeholder="Greenhouse, Patio, Front Yard…"/><button onclick="addZone()">Add</button></div><div class="section-head"><div class="section-title">Zone cleanup</div></div>${state.zones.map(z=>`<div class="card row"><div class="grow"><b>${esc(z)}</b><div class="card-copy">${state.plants.filter(p=>p.zone===z).length} plant${state.plants.filter(p=>p.zone===z).length===1?'':'s'}</div></div><button class="button secondary small" onclick="deleteZone(decodeURIComponent('${encodeURIComponent(z)}'))" ${state.plants.some(p=>p.zone===z)||state.zones.length===1?'disabled':''}>Delete empty</button></div>`).join('')}<div class="card privacy-card"><div class="privacy-title">🔒 Local garden only</div><div class="privacy-copy">Sites, Zones, plants, logs, photos, staged devices and automation previews stay in this browser.</div></div>`;
    }
    function finishScreen(){return onboardingShell(`<div class="onboarding-card"><div class="hero-icon">${parent().icon}</div><div class="eyebrow">You're ready</div><h2>${parent().label}'s got the garden.</h2><p class="lead">Consumer Alpha ${BUILD} completes the local front-end loop: onboarding, plants, care, history, data safety, local intelligence and the Fake Hub #0000 Demo Lab — without connecting anything external.</p><div class="actions"><button class="button primary" onclick="finishOnboarding()">Open my Garden</button></div></div>`,4);}
    function parentScreen(){
      const checkpoint=checkpointInfo(),migrated=(state.migrationHistory||[]).slice(-1)[0],migrationLine=migrated?`Migrated ${esc(migrated.from)} → schema ${SCHEMA_VERSION} on ${new Date(migrated.date).toLocaleString()}.`:`Created on local schema ${SCHEMA_VERSION}.`,backupLine=state.lastBackupAt?new Date(state.lastBackupAt).toLocaleString():'No manual backup yet';
      return shell(`<div class="eyebrow">Your Plant Parent</div><h1 class="page-title">${parent().label}'s on duty.</h1><p class="page-sub">Caretaker, preferences, product information and local data controls in one place.</p><div class="parent-grid">${Object.entries(caretakers).map(([key,p])=>`<button class="parent-choice ${state.caretaker===key?'active':''}" onclick="switchCaretaker('${key}')"><span class="parent-avatar">${p.icon}</span><span class="parent-copy"><span class="parent-name">${p.label}</span><span class="parent-pronouns">${p.pronouns}</span><span class="parent-line">${p.line}</span></span><span class="selection-check">✓</span></button>`).join('')}</div><div class="section-head"><div class="section-title">Appearance</div></div><div class="segmented"><button class="${state.appearance==='system'?'active':''}" onclick="setAppearance('system')">◐ System</button><button class="${state.appearance==='light'?'active':''}" onclick="setAppearance('light')">☀️ Light</button><button class="${state.appearance==='dark'?'active':''}" onclick="setAppearance('dark')">🌙 Dark</button></div><div class="section-head"><div class="section-title">Plant Daddy</div></div><div class="settings-grid"><button class="settings-card" onclick="openInfo('alpha')"><span>✅</span><b>Alpha 1.1 Status</b><small>See what is complete before we connect anything external.</small></button><button class="settings-card" onclick="openHelp()"><span>🌱</span><b>Plant Daddy 101</b><small>Quick tour of the product.</small></button><button class="settings-card" onclick="openInfo('readability')"><span>👓</span><b>Readability 1.1</b><small>Contrast, form fields, focus states and tap targets.</small></button><button class="settings-card" onclick="openInfo('plans')"><span>🧠</span><b>Free vs Ultra</b><small>What stays free and what becomes intelligence.</small></button><button class="settings-card" onclick="openInfo('privacy')"><span>🔒</span><b>Privacy & Data</b><small>See exactly what this build can and cannot access.</small></button><button class="settings-card" onclick="openInfo('about')"><span>🌿</span><b>About Plant Daddy</b><small>DCW Grows roots, build and library versions.</small></button></div><div class="section-head"><div><div class="section-title">Local Data Manager</div><div class="section-sub">Portable local data before we ever add accounts or sync.</div></div></div><div class="card"><div class="card-title">🩺 Data Health</div><div class="card-copy">Schema <strong>v${SCHEMA_VERSION}</strong> • Care Library v${state.careLibraryVersion}<br>${state.plants.length} plants • ${state.zones.length} zones • ${state.logs.length} events • ${state.devices.length} staged devices • ${state.photos.length} photos<br>Approx. local data size: <strong>${formatBytes(localDataBytes())}</strong></div><div class="verification-note">${migrationLine}</div></div><div class="card"><div class="card-title">💾 Backup & Restore</div><div class="card-copy">Export one portable JSON file containing this preview's Garden, plants, care history, staged devices, settings and locally saved photos.</div><div class="verification-note">Last manual backup: ${backupLine}</div><div class="actions inline"><button class="button primary" onclick="downloadBackup()">⬇️ Download backup</button><button class="button secondary" onclick="chooseRestoreFile()">⬆️ Restore backup</button></div><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreBackup(this)"></div><div class="card"><div class="card-title">🛟 Safety Checkpoint</div><div class="card-copy">Before restore/reset, Plant Daddy keeps one local rollback checkpoint.</div><div class="verification-note">${checkpoint?`Checkpoint: ${new Date(checkpoint.exportedAt).toLocaleString()} • ${esc(checkpoint.reason||'safety')}`:'No checkpoint yet.'}</div><button class="button secondary" onclick="restoreCheckpoint()" ${checkpoint?'':'disabled'}>↩️ Restore safety checkpoint</button></div><div class="card privacy-card"><div class="privacy-title">🔒 Hub #0001 stays separate</div><div class="privacy-copy">No network call in this file targets your Mac, Zigbee2MQTT, MQTT, local database or personal plant history.</div></div><button class="danger-button" onclick="resetBuild()">Reset onboarding & Build ${BUILD} local data</button>`);
    }


    function renderMain() { if(selectedPlantId)return plantDetailScreen(); const screens={plants:homeScreen, care:careScreen, add:addScreen, garden:gardenMainScreen, parent:parentScreen}; return (screens[state.screen] || homeScreen)(); }
    function render() { applyAppearance(); app.innerHTML = state.onboarded ? renderMain() : renderOnboarding(); }
    applyAppearance();
    render();
  </script>
</body>
</html>
