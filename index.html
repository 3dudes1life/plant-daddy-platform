<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#153923" />
  <meta name="color-scheme" content="light dark" />
  <title>Plant Daddy — Build 0.2</title>
  <style>
    :root {
      --bg: #f3f5f0;
      --bg-elevated: rgba(255,255,255,.86);
      --card: #ffffff;
      --card-2: #f8faf6;
      --text: #142018;
      --sub: #687169;
      --muted: #929a93;
      --line: #e1e6df;
      --accent: #277a49;
      --accent-strong: #155b32;
      --accent-soft: #e4f3e8;
      --accent-softer: #eef7f0;
      --warning: #a86612;
      --warning-soft: #fff3df;
      --danger: #b23b38;
      --shadow: 0 18px 55px rgba(32, 64, 42, .10);
      --shadow-soft: 0 8px 26px rgba(32, 64, 42, .07);
      --glass: rgba(247,249,245,.80);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d130f;
        --bg-elevated: rgba(23,31,25,.88);
        --card: #172019;
        --card-2: #1c271f;
        --text: #f2f6f2;
        --sub: #a4afa6;
        --muted: #78827a;
        --line: #2b362e;
        --accent: #7ad59b;
        --accent-strong: #9ce7b5;
        --accent-soft: #203d2a;
        --accent-softer: #172d20;
        --warning: #f0b965;
        --warning-soft: #382b19;
        --danger: #ff8f89;
        --shadow: none;
        --shadow-soft: none;
        --glass: rgba(17,24,19,.82);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    input { color: var(--text); }
    .app { min-height: 100vh; }
    .page-shell { min-height: 100vh; padding-bottom: 102px; }
    .page { width: min(760px, 100%); margin: 0 auto; padding: 24px 20px 38px; }
    .onboarding-page { width: min(660px,100%); margin: 0 auto; min-height: 100vh; padding: max(24px, env(safe-area-inset-top)) 20px max(34px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
    .brandbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
    .brand { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:900; letter-spacing:-.2px; }
    .brand-mark { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--accent-soft); font-size:20px; }
    .build-tag { border-radius:999px; background:var(--card); border:1px solid var(--line); padding:7px 10px; color:var(--sub); font-size:11px; font-weight:800; letter-spacing:.3px; }
    .progress { display:flex; gap:7px; margin: 0 0 24px; }
    .progress span { height:5px; flex:1; border-radius:99px; background:var(--line); transition:.2s ease; }
    .progress span.on { background:var(--accent); }
    .onboarding-card { margin:auto 0; background:var(--bg-elevated); border:1px solid var(--line); border-radius:30px; padding:clamp(24px,6vw,38px); box-shadow:var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .hero-icon { width:78px; height:78px; border-radius:25px; display:grid; place-items:center; font-size:43px; background:linear-gradient(145deg,var(--accent-soft),var(--card)); box-shadow:var(--shadow-soft); margin-bottom:23px; }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:900; letter-spacing:1.45px; text-transform:uppercase; }
    h1 { font-size:clamp(34px,8vw,52px); line-height:1.02; margin:9px 0 0; font-weight:950; letter-spacing:-1.8px; }
    h2 { font-size:clamp(27px,6vw,36px); line-height:1.07; margin:8px 0 0; font-weight:920; letter-spacing:-1.1px; }
    .lead { margin:14px 0 0; color:var(--sub); font-size:17px; line-height:1.52; }
    .tagline { display:inline-flex; align-items:center; gap:8px; margin-top:19px; padding:9px 12px; border-radius:999px; background:var(--accent-soft); color:var(--accent-strong); font-size:13px; font-weight:850; }
    .actions { display:grid; gap:10px; margin-top:28px; }
    .button { border:0; border-radius:17px; padding:15px 17px; min-height:52px; font-weight:880; cursor:pointer; transition:transform .14s ease, opacity .14s ease; }
    .button:active { transform:scale(.985); }
    .button.primary { background:var(--accent-strong); color:#fff; }
    @media (prefers-color-scheme: dark) { .button.primary { color:#0b1a10; } }
    .button.secondary { background:var(--card); border:1px solid var(--line); }
    .button.ghost { background:transparent; color:var(--accent); }
    .button:disabled { cursor:not-allowed; opacity:.45; }
    .fineprint { margin-top:14px; color:var(--muted); font-size:12px; line-height:1.45; text-align:center; }

    .parent-grid { display:grid; gap:11px; margin-top:24px; }
    .parent-choice { width:100%; border:1.5px solid var(--line); background:var(--card); border-radius:21px; padding:15px 16px; display:flex; align-items:center; gap:14px; cursor:pointer; text-align:left; transition:.17s ease; }
    .parent-choice:hover { transform:translateY(-1px); }
    .parent-choice.active { background:var(--accent-softer); border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
    .parent-avatar { width:50px; height:50px; border-radius:16px; display:grid; place-items:center; font-size:27px; background:var(--card-2); }
    .parent-copy { flex:1; min-width:0; }
    .parent-name { font-size:17px; font-weight:900; }
    .parent-pronouns { margin-top:3px; color:var(--sub); font-size:13px; }
    .parent-line { margin-top:5px; color:var(--sub); font-size:12px; }
    .selection-check { width:25px; height:25px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-size:14px; font-weight:900; color:transparent; }
    .parent-choice.active .selection-check { background:var(--accent); border-color:var(--accent); color:white; }

    .field-stack { display:grid; gap:17px; margin-top:25px; }
    .field label { display:block; font-size:12px; font-weight:850; color:var(--sub); margin:0 0 7px 4px; }
    .field input { width:100%; border:1.5px solid var(--line); background:var(--card); border-radius:17px; min-height:54px; padding:0 16px; outline:none; font-size:16px; transition:.16s border-color,.16s box-shadow; }
    .field input:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
    .field-help { color:var(--muted); font-size:12px; line-height:1.45; margin:7px 4px 0; }
    .setup-preview { margin-top:18px; border-radius:20px; padding:16px; background:var(--card-2); border:1px solid var(--line); }
    .crumb { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:850; }
    .crumb span { color:var(--muted); }

    .finish-ring { width:94px; height:94px; border-radius:31px; background:var(--accent-soft); display:grid; place-items:center; font-size:52px; margin-bottom:22px; }
    .finish-list { display:grid; gap:10px; margin-top:22px; }
    .finish-item { display:flex; gap:11px; align-items:flex-start; color:var(--sub); font-size:14px; line-height:1.45; }
    .finish-item b { color:var(--text); }
    .finish-item .tick { color:var(--accent); font-weight:950; }

    .topbar { position:sticky; top:0; z-index:30; background:var(--glass); border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
    .topbar-inner { width:min(760px,100%); margin:auto; padding:max(10px,env(safe-area-inset-top)) 20px 10px; display:flex; align-items:center; gap:12px; }
    .topbar .brand { flex:1; }
    .local-pill { display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent-strong); font-size:11px; font-weight:850; }
    .demo-banner { width:min(760px,100%); margin:15px auto -3px; padding:0 20px; }
    .demo-inner { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--warning-soft); color:var(--warning); border:1px solid color-mix(in srgb,var(--warning) 28%,transparent); border-radius:16px; padding:10px 12px; font-size:12px; font-weight:800; }
    .demo-inner button { border:0; background:transparent; color:inherit; font-weight:900; cursor:pointer; }
    .screen-title { margin:6px 0 0; font-size:clamp(31px,7vw,43px); }
    .screen-sub { color:var(--sub); font-size:15px; line-height:1.5; margin:9px 0 23px; }
    .summary-row { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:0 0 25px; }
    .summary { border-radius:19px; background:var(--card); padding:14px; box-shadow:var(--shadow-soft); }
    .summary b { display:block; font-size:25px; }
    .summary span { display:block; margin-top:2px; color:var(--sub); font-size:11px; font-weight:800; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin:20px 0 11px; }
    .section-title { font-size:19px; font-weight:900; }
    .text-button { border:0; background:transparent; color:var(--accent); font-weight:850; cursor:pointer; padding:5px 0; }
    .card { background:var(--card); border:1px solid color-mix(in srgb,var(--line) 80%,transparent); border-radius:22px; padding:18px; margin-bottom:11px; box-shadow:var(--shadow-soft); }
    .card-title { font-size:17px; font-weight:900; }
    .card-copy { color:var(--sub); font-size:14px; line-height:1.48; margin-top:5px; }
    .empty { text-align:center; padding:30px 21px 25px; }
    .empty-icon { width:74px; height:74px; margin:0 auto 17px; display:grid; place-items:center; background:var(--accent-soft); border-radius:24px; font-size:39px; }
    .empty h3 { font-size:21px; margin:0; }
    .empty p { color:var(--sub); font-size:14px; line-height:1.5; margin:8px auto 20px; max-width:440px; }
    .empty-actions { display:grid; gap:9px; max-width:390px; margin:0 auto; }
    .plant-card { width:100%; border:0; text-align:left; cursor:pointer; background:var(--card); border-radius:21px; padding:16px; margin-bottom:10px; box-shadow:var(--shadow-soft); }
    .plant-top { display:flex; align-items:center; gap:12px; }
    .plant-emoji { font-size:33px; }
    .grow { flex:1; min-width:0; }
    .plant-name { font-weight:900; font-size:16px; }
    .plant-species { color:var(--sub); font-size:12px; margin-top:2px; }
    .plant-metric { font-size:25px; font-weight:950; color:var(--accent); }
    .plant-bottom { margin-top:13px; display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--sub); font-size:12px; }
    .attention { color:var(--warning); font-weight:850; }
    .row { display:flex; align-items:center; gap:13px; }
    .row-icon { width:44px; height:44px; flex:none; border-radius:14px; background:var(--card-2); display:grid; place-items:center; font-size:23px; }
    .chev { margin-left:auto; color:var(--muted); font-size:24px; }
    .coming { display:inline-flex; padding:5px 8px; border-radius:999px; background:var(--card-2); color:var(--sub); font-size:10px; font-weight:850; margin-top:8px; }
    .garden-card { overflow:hidden; padding:0; }
    .garden-hero { padding:19px; background:linear-gradient(145deg,var(--accent-soft),var(--card)); border-bottom:1px solid var(--line); }
    .garden-name { font-size:22px; font-weight:930; }
    .garden-zone { color:var(--sub); font-size:13px; margin-top:5px; }
    .garden-body { padding:17px 19px 19px; }
    .garden-stat { display:flex; justify-content:space-between; gap:15px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
    .garden-stat:last-child { border-bottom:0; }
    .garden-stat span:first-child { color:var(--sub); }
    .edit-panel { margin-top:13px; display:none; }
    .edit-panel.open { display:block; }
    .danger-button { border:0; background:transparent; color:var(--danger); font-weight:850; padding:10px 0; cursor:pointer; }
    .privacy-card { background:var(--accent-softer); }
    .privacy-title { display:flex; gap:8px; align-items:center; font-weight:900; }
    .privacy-copy { color:var(--sub); font-size:13px; line-height:1.5; margin-top:7px; }

    .nav { position:fixed; left:0; right:0; bottom:0; z-index:40; display:grid; grid-template-columns:repeat(5,1fr); background:var(--glass); border-top:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); padding:8px max(8px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left)); }
    .nav button { border:0; background:transparent; color:var(--sub); cursor:pointer; padding:3px 1px; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .nav button.active { color:var(--accent); }
    .nav-icon { font-size:20px; line-height:1.1; }
    .nav-label { font-size:10px; font-weight:820; }

    .modal-wrap { position:fixed; inset:0; z-index:100; display:grid; place-items:end center; background:rgba(0,0,0,.33); padding:18px; opacity:0; pointer-events:none; transition:.18s ease; }
    .modal-wrap.show { opacity:1; pointer-events:auto; }
    .sheet { width:min(560px,100%); background:var(--card); border-radius:28px; padding:22px; box-shadow:0 24px 80px rgba(0,0,0,.25); transform:translateY(25px); transition:.2s ease; }
    .modal-wrap.show .sheet { transform:translateY(0); }
    .sheet-handle { width:42px; height:5px; border-radius:99px; background:var(--line); margin:0 auto 18px; }
    .sheet-icon { font-size:36px; }
    .sheet h3 { font-size:22px; margin:10px 0 7px; }
    .sheet p { color:var(--sub); line-height:1.5; margin:0; font-size:14px; }
    .sheet .actions { margin-top:20px; }
    .toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(18px); opacity:0; z-index:120; background:var(--text); color:var(--bg); max-width:calc(100vw - 30px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:11px 15px; border-radius:999px; font-size:13px; font-weight:850; pointer-events:none; transition:.2s ease; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    @media (min-width: 640px) {
      .actions.inline { grid-template-columns:1fr 1fr; }
    }
    @media (max-width:480px) {
      .page { padding-left:14px; padding-right:14px; }
      .topbar-inner, .demo-banner { padding-left:14px; padding-right:14px; }
      .onboarding-page { padding-left:14px; padding-right:14px; }
      .onboarding-card { border-radius:25px; }
      .summary { padding:12px; }
      .summary b { font-size:22px; }
      .local-pill { padding:6px 8px; }
    }
  </style>
</head>
<body>
  <main id="app" class="app"></main>
  <div id="modal" class="modal-wrap" role="dialog" aria-modal="true" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const BUILD = '0.2.0';
    const STORAGE_KEY = 'plantDaddy.build02.state';

    const caretakers = {
      daddy: { label:'Daddy', pronouns:'He/Him', icon:'💪', line:'Daddy handles the rest.' },
      mama: { label:'Mama', pronouns:'She/Her', icon:'🌺', line:'Mama handles the rest.' },
      buddy: { label:'Buddy', pronouns:'They/Them', icon:'🌱', line:'Buddy handles the rest.' }
    };

    const demoPlants = [
      { id:'demo-coconut', name:'Coconut Palm', species:'Cocos nucifera', emoji:'🌴', status:'happy', moisture:46, temp:81 },
      { id:'demo-plumeria', name:'Plumeria Bed West', species:'Plumeria rubra', emoji:'🌺', status:'attention', moisture:24, temp:94 },
      { id:'demo-hibiscus', name:'Hibiscus Red', species:'Hibiscus rosa-sinensis', emoji:'🌺', status:'happy', moisture:55, temp:84 },
      { id:'demo-mona', name:'Mona', species:'Monstera deliciosa', emoji:'🪴', status:'happy', moisture:41, temp:76 }
    ];

    const defaults = {
      onboarded: false,
      onboardingStep: 1,
      caretaker: 'daddy',
      draftCaretaker: 'daddy',
      siteName: 'Home',
      zoneName: 'My Plants',
      screen: 'plants',
      demoMode: false
    };

    let state = loadState();
    const app = document.getElementById('app');

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return { ...defaults, ...saved, screen:'plants' };
      } catch (_) {
        return { ...defaults };
      }
    }

    function saveState() {
      const persisted = {
        onboarded: state.onboarded,
        onboardingStep: state.onboardingStep,
        caretaker: state.caretaker,
        draftCaretaker: state.draftCaretaker,
        siteName: state.siteName,
        zoneName: state.zoneName,
        demoMode: state.demoMode
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(persisted));
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    }

    function parent() { return caretakers[state.caretaker] || caretakers.daddy; }
    function draftParent() { return caretakers[state.draftCaretaker] || caretakers.daddy; }

    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(window.__pdToast);
      window.__pdToast = setTimeout(() => el.classList.remove('show'), 1800);
    }

    function showModal(kind) {
      const modal = document.getElementById('modal');
      if (kind === 'account') {
        modal.innerHTML = `<div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet-handle"></div>
          <div class="sheet-icon">☁️</div>
          <h3>Accounts come later.</h3>
          <p>Build ${BUILD} is intentionally local-only. There is no sign-in service, cloud sync, or connection to your Mac. You can still build a garden and test the full first-time experience on this device.</p>
          <div class="actions">
            <button class="button primary" onclick="closeModal(); startOnboarding()">Continue locally</button>
            <button class="button secondary" onclick="closeModal()">Not yet</button>
          </div>
        </div>`;
      }
      modal.classList.add('show');
      modal.setAttribute('aria-hidden','false');
      modal.onclick = closeModal;
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
      setTimeout(() => modal.innerHTML = '', 180);
    }

    function startOnboarding() {
      state.onboardingStep = 2;
      state.draftCaretaker = state.caretaker;
      saveState();
      render();
      scrollTop();
    }

    function onboardingBack() {
      if (state.onboardingStep > 1) {
        state.onboardingStep -= 1;
        saveState();
        render();
        scrollTop();
      }
    }

    function chooseDraftCaretaker(key) {
      if (!caretakers[key]) return;
      state.draftCaretaker = key;
      saveState();
      render();
    }

    function caretakerNext() {
      state.caretaker = state.draftCaretaker;
      state.onboardingStep = 3;
      saveState();
      render();
      scrollTop();
      setTimeout(() => document.getElementById('siteName')?.focus(), 50);
    }

    function gardenNext() {
      const site = document.getElementById('siteName')?.value.trim();
      const zone = document.getElementById('zoneName')?.value.trim();
      if (!site || !zone) {
        toast('Give your garden and first zone a name 🌱');
        return;
      }
      state.siteName = site.slice(0,60);
      state.zoneName = zone.slice(0,60);
      state.onboardingStep = 4;
      saveState();
      render();
      scrollTop();
    }

    function finishOnboarding() {
      state.onboarded = true;
      state.onboardingStep = 4;
      state.screen = 'plants';
      state.demoMode = false;
      saveState();
      render();
      scrollTop();
      setTimeout(() => toast(`${parent().label} is officially on plant duty 🌱`), 100);
    }

    function onboardingShell(content, step) {
      return `<section class="onboarding-page">
        <div class="brandbar">
          <div class="brand"><div class="brand-mark">🌱</div><span>Plant Daddy</span></div>
          <div class="build-tag">BUILD ${BUILD}</div>
        </div>
        <div class="progress" aria-label="Setup progress">
          ${[1,2,3,4].map(n => `<span class="${n <= step ? 'on':''}"></span>`).join('')}
        </div>
        ${content}
      </section>`;
    }

    function welcomeScreen() {
      return onboardingShell(`<div class="onboarding-card">
        <div class="hero-icon">🌿</div>
        <div class="eyebrow">Welcome to Plant Daddy</div>
        <h1>Keeping plants alive shouldn't be a full-time job.</h1>
        <p class="lead">Start with nothing but a plant and your phone. Add sensors, intelligence and automation only when you want them.</p>
        <div class="tagline">💦 Keep It Moist. <span>•</span> Daddy handles the rest.</div>
        <div class="actions">
          <button class="button primary" onclick="startOnboarding()">Get Started</button>
          <button class="button secondary" onclick="showModal('account')">I already have an account</button>
        </div>
        <div class="fineprint">No account required in this build. Nothing leaves this browser.</div>
      </div>`,1);
    }

    function caretakerScreen() {
      return onboardingShell(`<div class="onboarding-card">
        <button class="text-button" onclick="onboardingBack()">‹ Back</button>
        <div class="eyebrow">Choose your caretaker</div>
        <h2>Who do you want looking after your plants?</h2>
        <p class="lead">Pick whoever makes you happy. You can switch anytime.</p>
        <div class="parent-grid">
          ${Object.entries(caretakers).map(([key,p]) => `<button class="parent-choice ${state.draftCaretaker===key?'active':''}" onclick="chooseDraftCaretaker('${key}')">
            <span class="parent-avatar">${p.icon}</span>
            <span class="parent-copy"><span class="parent-name">${p.label}</span><span class="parent-pronouns">${p.pronouns}</span><span class="parent-line">${p.line}</span></span>
            <span class="selection-check">✓</span>
          </button>`).join('')}
        </div>
        <div class="actions"><button class="button primary" onclick="caretakerNext()">Continue with ${draftParent().label}</button></div>
        <div class="fineprint">Caretaker changes personality and copy — never your plants, history or plan.</div>
      </div>`,2);
    }

    function gardenScreenOnboarding() {
      return onboardingShell(`<div class="onboarding-card">
        <button class="text-button" onclick="onboardingBack()">‹ Back</button>
        <div class="eyebrow">Create your garden</div>
        <h2>Give your plants somewhere to live.</h2>
        <p class="lead">A Garden is a property or site. Zones keep plants organized inside it.</p>
        <div class="field-stack">
          <div class="field">
            <label for="siteName">GARDEN / SITE NAME</label>
            <input id="siteName" maxlength="60" value="${esc(state.siteName)}" placeholder="Home" autocomplete="off" />
            <div class="field-help">Examples: Home, Greenhouse, Office, Hawaiʻi Farm.</div>
          </div>
          <div class="field">
            <label for="zoneName">FIRST ZONE</label>
            <input id="zoneName" maxlength="60" value="${esc(state.zoneName)}" placeholder="My Plants" autocomplete="off" />
            <div class="field-help">Examples: Living Room, Tropical Patio, Plumeria Bed.</div>
          </div>
        </div>
        <div class="setup-preview"><div class="crumb">🏡 <span id="previewSite">${esc(state.siteName)}</span> <span>›</span> 🌿 <span id="previewZone">${esc(state.zoneName)}</span></div></div>
        <div class="actions"><button class="button primary" onclick="gardenNext()">Create Garden</button></div>
        <div class="fineprint">Stored locally on this device for Build ${BUILD}. No cloud account exists yet.</div>
      </div>`,3);
    }

    function finishScreen() {
      return onboardingShell(`<div class="onboarding-card">
        <div class="finish-ring">${parent().icon}</div>
        <div class="eyebrow">You're ready</div>
        <h2>${parent().label}'s got the garden.</h2>
        <p class="lead">Your Plant Daddy space is ready. Build 0.3 will add the first real plant-creation flow.</p>
        <div class="finish-list">
          <div class="finish-item"><span class="tick">✓</span><span><b>${parent().label}</b> selected as your caretaker.</span></div>
          <div class="finish-item"><span class="tick">✓</span><span><b>${esc(state.siteName)}</b> created as your first Garden.</span></div>
          <div class="finish-item"><span class="tick">✓</span><span><b>${esc(state.zoneName)}</b> created as your first Zone.</span></div>
          <div class="finish-item"><span class="tick">✓</span><span>Everything is <b>local-only</b> in this build.</span></div>
        </div>
        <div class="actions"><button class="button primary" onclick="finishOnboarding()">Open Plant Daddy</button></div>
      </div>`,4);
    }

    function renderOnboarding() {
      if (state.onboardingStep <= 1) return welcomeScreen();
      if (state.onboardingStep === 2) return caretakerScreen();
      if (state.onboardingStep === 3) return gardenScreenOnboarding();
      return finishScreen();
    }

    function navButton(screen,icon,label) {
      return `<button class="${state.screen===screen?'active':''}" onclick="go('${screen}')"><span class="nav-icon">${icon}</span><span class="nav-label">${esc(label)}</span></button>`;
    }

    function nav() {
      return `<nav class="nav">
        ${navButton('plants','🌱','Plants')}
        ${navButton('care','💧','Care')}
        ${navButton('add','＋','Add')}
        ${navButton('garden','▦','Garden')}
        ${navButton('parent',parent().icon,parent().label)}
      </nav>`;
    }

    function topbar() {
      return `<header class="topbar"><div class="topbar-inner">
        <div class="brand"><div class="brand-mark">🌱</div><span>Plant Daddy</span></div>
        <div class="local-pill">● Local only</div>
      </div></header>`;
    }

    function demoBanner() {
      if (!state.demoMode) return '';
      return `<div class="demo-banner"><div class="demo-inner"><span>🧪 DEMO GARDEN • SYNTHETIC DATA ONLY</span><button onclick="toggleDemo(false)">Exit</button></div></div>`;
    }

    function shell(content) {
      return `<div class="page-shell">${topbar()}${demoBanner()}<section class="page">${content}</section>${nav()}</div>`;
    }

    function go(screen) {
      state.screen = screen;
      render();
      scrollTop();
    }

    function scrollTop() { window.scrollTo({top:0,behavior:'smooth'}); }

    function toggleDemo(on) {
      state.demoMode = !!on;
      state.screen = 'plants';
      saveState();
      render();
      scrollTop();
      toast(on ? 'Synthetic Demo Garden opened 🧪' : 'Back to your empty garden 🌱');
    }

    function homeScreen() {
      if (state.demoMode) {
        const happy = demoPlants.filter(p => p.status==='happy').length;
        const attention = demoPlants.filter(p => p.status==='attention').length;
        return shell(`<div class="eyebrow">${esc(state.siteName)}</div><h1 class="screen-title">${parent().label}'s watching ${demoPlants.length} demo plants.</h1><p class="screen-sub">These plants are synthetic and are not saved into your Garden.</p>
          <div class="summary-row"><div class="summary"><b>${happy}</b><span>Happy</span></div><div class="summary"><b>${attention}</b><span>Attention</span></div><div class="summary"><b>0</b><span>Critical</span></div></div>
          <div class="section-head"><div class="section-title">Demo plants</div><button class="text-button" onclick="toggleDemo(false)">My Garden</button></div>
          ${demoPlants.map(plantCard).join('')}`);
      }

      return shell(`<div class="eyebrow">${esc(state.siteName)}</div><h1 class="screen-title">${parent().label}'s ready for the first plant.</h1><p class="screen-sub">Your Garden is set up. Nothing is added automatically — this is your clean empty state.</p>
        <div class="summary-row"><div class="summary"><b>0</b><span>Happy</span></div><div class="summary"><b>0</b><span>Attention</span></div><div class="summary"><b>0</b><span>Critical</span></div></div>
        <div class="card empty">
          <div class="empty-icon">🪴</div>
          <h3>No plants yet. Perfect.</h3>
          <p>Build 0.3 is where you'll search the Plant Care Library, name a plant and choose whether you're using just your phone, a sensor or smart watering.</p>
          <div class="empty-actions">
            <button class="button primary" onclick="go('add')">Add your first plant</button>
            <button class="button secondary" onclick="toggleDemo(true)">Preview with demo plants</button>
          </div>
        </div>
        <div class="card privacy-card"><div class="privacy-title">🔒 Clean-room boundary active</div><div class="privacy-copy">This build cannot discover, import or read Plant Daddy Hub #0001, MQTT, Zigbee, SQLite, sensors or files on your Mac.</div></div>`);
    }

    function plantCard(p) {
      return `<button class="plant-card" onclick="toast('Plant details stay demo-only until Build 0.4')"><div class="plant-top"><span class="plant-emoji">${p.emoji}</span><div class="grow"><div class="plant-name">${esc(p.name)}</div><div class="plant-species">${esc(p.species)}</div></div><div class="plant-metric">${p.moisture}%</div></div><div class="plant-bottom"><span>Soil ${p.temp}°F</span><span class="${p.status==='attention'?'attention':''}">${p.status==='attention'?'Needs attention':'Good'}</span></div></button>`;
    }

    function careScreen() {
      if (state.demoMode) {
        const attention = demoPlants.filter(p => p.status==='attention');
        return shell(`<div class="eyebrow">Care</div><h1 class="screen-title">Needs Attention</h1><p class="screen-sub">A synthetic preview of how Plant Daddy will surface what matters.</p>
          ${attention.map(p => `<div class="card"><div class="row"><div class="row-icon">${p.emoji}</div><div class="grow"><div class="card-title">${esc(p.name)}</div><div class="card-copy">Moisture is approaching its demo dry range.</div></div><div class="chev">›</div></div></div>`).join('')}
          <div class="card"><div class="card-title">${parent().label}'s got the rest. 🌱</div><div class="card-copy">Healthy plants stay out of your way.</div></div>`);
      }
      return shell(`<div class="eyebrow">Care</div><h1 class="screen-title">Nothing needs attention.</h1><p class="screen-sub">Because you haven't added a plant yet — not because we're making up data.</p>
        <div class="card empty"><div class="empty-icon">💧</div><h3>Care starts with a plant.</h3><p>Once Build 0.3 adds your first plant, this becomes the place for watering, reminders and things worth looking at.</p><div class="empty-actions"><button class="button primary" onclick="go('add')">Go to Add</button></div></div>`);
    }

    function addScreen() {
      const items = [
        ['🌱','Add a plant','Search or browse the Plant Care Library, then name and place it.','Build 0.3'],
        ['📡','Add a sensor','Assign supported hardware to an existing plant.','Later'],
        ['💦','Add smart watering','Connect supported irrigation without making hardware the plant.','Later']
      ];
      return shell(`<div class="eyebrow">Add</div><h1 class="screen-title">Start simple.</h1><p class="screen-sub">A plant and a phone are enough. Hardware is always optional.</p>
        ${items.map((i,idx) => `<button class="plant-card" onclick="${idx===0?"toast('Plant creation arrives in Build 0.3 🌱')":"toast('That integration stays intentionally disconnected for now')"}"><div class="row"><div class="row-icon">${i[0]}</div><div class="grow"><div class="card-title">${i[1]}</div><div class="card-copy">${i[2]}</div><span class="coming">${i[3]}</span></div><div class="chev">›</div></div></button>`).join('')}`);
    }

    function toggleGardenEdit() {
      document.getElementById('gardenEdit')?.classList.toggle('open');
    }

    function saveGardenEdit() {
      const site = document.getElementById('editSite')?.value.trim();
      const zone = document.getElementById('editZone')?.value.trim();
      if (!site || !zone) { toast('Both names need something in them 🌱'); return; }
      state.siteName = site.slice(0,60);
      state.zoneName = zone.slice(0,60);
      saveState();
      render();
      toast('Garden saved locally ✓');
    }

    function gardenMainScreen() {
      return shell(`<div class="eyebrow">Garden</div><h1 class="screen-title">Your growing space.</h1><p class="screen-sub">Sites and Zones exist before any hardware does.</p>
        <div class="card garden-card"><div class="garden-hero"><div class="garden-name">🏡 ${esc(state.siteName)}</div><div class="garden-zone">🌿 ${esc(state.zoneName)}</div></div><div class="garden-body">
          <div class="garden-stat"><span>Plants</span><strong>${state.demoMode?demoPlants.length:0}${state.demoMode?' demo':''}</strong></div>
          <div class="garden-stat"><span>Connected devices</span><strong>0</strong></div>
          <div class="garden-stat"><span>Cloud sync</span><strong>Off</strong></div>
          <button class="text-button" onclick="toggleGardenEdit()">Edit Garden names</button>
          <div id="gardenEdit" class="edit-panel"><div class="field-stack"><div class="field"><label for="editSite">GARDEN / SITE</label><input id="editSite" value="${esc(state.siteName)}" maxlength="60" /></div><div class="field"><label for="editZone">ZONE</label><input id="editZone" value="${esc(state.zoneName)}" maxlength="60" /></div></div><div class="actions"><button class="button primary" onclick="saveGardenEdit()">Save locally</button></div></div>
        </div></div>
        <div class="card"><div class="card-title">Why Sites + Zones already?</div><div class="card-copy">So one account can eventually hold a Home, Office, Greenhouse or farm without rebuilding the data model later.</div></div>`);
    }

    function switchCaretaker(key) {
      if (!caretakers[key]) return;
      state.caretaker = key;
      state.draftCaretaker = key;
      saveState();
      render();
      toast(`${caretakers[key].label} is on plant duty 🌱`);
    }

    function resetBuild() {
      if (!confirm('Reset Build 0.2 and replay first-time setup? This only clears Plant Daddy demo settings in this browser.')) return;
      localStorage.removeItem(STORAGE_KEY);
      state = { ...defaults };
      render();
      scrollTop();
    }

    function parentScreen() {
      return shell(`<div class="eyebrow">Your Plant Parent</div><h1 class="screen-title">${parent().label}'s on duty.</h1><p class="screen-sub">Switch anytime. Your Garden doesn't change.</p>
        <div class="parent-grid">${Object.entries(caretakers).map(([key,p]) => `<button class="parent-choice ${state.caretaker===key?'active':''}" onclick="switchCaretaker('${key}')"><span class="parent-avatar">${p.icon}</span><span class="parent-copy"><span class="parent-name">${p.label}</span><span class="parent-pronouns">${p.pronouns}</span><span class="parent-line">${p.line}</span></span><span class="selection-check">✓</span></button>`).join('')}</div>
        <div class="section-head"><div class="section-title">Build settings</div></div>
        <div class="card"><div class="card-title">Local-only mode</div><div class="card-copy">Your caretaker, Garden name and Zone name are stored only in this browser. There is no account or cloud service behind this preview.</div></div>
        <div class="card privacy-card"><div class="privacy-title">🔒 Hub #0001 stays separate</div><div class="privacy-copy">No network call in this file targets your Mac, Zigbee2MQTT, MQTT, local database or personal plant history.</div></div>
        <button class="danger-button" onclick="resetBuild()">Reset onboarding & local demo settings</button>`);
    }

    function renderMain() {
      const screens = { plants:homeScreen, care:careScreen, add:addScreen, garden:gardenMainScreen, parent:parentScreen };
      return (screens[state.screen] || homeScreen)();
    }

    function bindGardenPreview() {
      const site = document.getElementById('siteName');
      const zone = document.getElementById('zoneName');
      const previewSite = document.getElementById('previewSite');
      const previewZone = document.getElementById('previewZone');
      if (site && previewSite) site.addEventListener('input', () => previewSite.textContent = site.value || 'Garden');
      if (zone && previewZone) zone.addEventListener('input', () => previewZone.textContent = zone.value || 'Zone');
    }

    function render() {
      app.innerHTML = state.onboarded ? renderMain() : renderOnboarding();
      if (!state.onboarded && state.onboardingStep === 3) bindGardenPreview();
    }

    render();
  </script>
</body>
</html>
